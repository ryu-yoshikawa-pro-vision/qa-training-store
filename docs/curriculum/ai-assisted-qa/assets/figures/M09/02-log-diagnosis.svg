<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc"><title id="title">CIログで失敗箇所を探す</title><desc id="desc">赤い状態だけで原因を決めず、最初の失敗step、直前の出力、artifact、ローカル再現条件を照合する。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#53657a"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#182230}.heading{font-size:21px;font-weight:700}.body{font-size:16px}.number{font-size:16px;font-weight:700;fill:#fff}</style><rect width="1200" height="280" fill="#fff"/><text x="40" y="33" class="heading">CIログで失敗箇所を探す</text><path d="M 283 145 H 323" fill="none" stroke="#53657a" stroke-width="4" marker-end="url(#arrow)"/><path d="M 578 145 H 618" fill="none" stroke="#53657a" stroke-width="4" marker-end="url(#arrow)"/><path d="M 873 145 H 913" fill="none" stroke="#53657a" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="40" y="54" width="235" height="182" rx="18" fill="#eaf2ff" stroke="#2463a6" stroke-width="3"/><circle cx="65" cy="81" r="15" fill="#2463a6"/><text x="65" y="87" text-anchor="middle" class="number">1</text><text x="157.5" y="119" text-anchor="middle" class="heading">Runを選ぶ</text><text x="157.5" y="145" text-anchor="middle" class="body">branch</text><text x="157.5" y="171" text-anchor="middle" class="body">commit を見る</text><text x="157.5" y="197" text-anchor="middle" class="body">PRとheadが一致するか</text></g><g><rect x="335" y="54" width="235" height="182" rx="18" fill="#eaf7f1" stroke="#23734d" stroke-width="3"/><circle cx="360" cy="81" r="15" fill="#23734d"/><text x="360" y="87" text-anchor="middle" class="number">2</text><text x="452.5" y="119" text-anchor="middle" class="heading">失敗step</text><text x="452.5" y="145" text-anchor="middle" class="body">最初のerrorを探す</text><text x="452.5" y="171" text-anchor="middle" class="body">後続失敗は分けて記録</text></g><g><rect x="630" y="54" width="235" height="182" rx="18" fill="#eaf2ff" stroke="#2463a6" stroke-width="3"/><circle cx="655" cy="81" r="15" fill="#2463a6"/><text x="655" y="87" text-anchor="middle" class="number">3</text><text x="747.5" y="119" text-anchor="middle" class="heading">Artifact</text><text x="747.5" y="145" text-anchor="middle" class="body">必要な証拠を開く</text><text x="747.5" y="171" text-anchor="middle" class="body">内容・作成元を確認</text></g><g><rect x="925" y="54" width="235" height="182" rx="18" fill="#eaf7f1" stroke="#23734d" stroke-width="3"/><circle cx="950" cy="81" r="15" fill="#23734d"/><text x="950" y="87" text-anchor="middle" class="number">4</text><text x="1042.5" y="119" text-anchor="middle" class="heading">次の行動</text><text x="1042.5" y="145" text-anchor="middle" class="body">修正か環境確認か</text><text x="1042.5" y="171" text-anchor="middle" class="body">原因と不確実さを報告</text></g></svg>
