<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc"><title id="title">コードの値から確認結果まで読む</title><desc id="desc">値と条件を追い、非同期のページ操作が終わるのを待って、Caseに対応するAssertionで期待を確かめる。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#53657a"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#182230}.heading{font-size:21px;font-weight:700}.body{font-size:16px}.number{font-size:16px;font-weight:700;fill:#fff}</style><rect width="1200" height="280" fill="#fff"/><text x="40" y="33" class="heading">コードの値から確認結果まで読む</text><path d="M 283 145 H 323" fill="none" stroke="#53657a" stroke-width="4" marker-end="url(#arrow)"/><path d="M 578 145 H 618" fill="none" stroke="#53657a" stroke-width="4" marker-end="url(#arrow)"/><path d="M 873 145 H 913" fill="none" stroke="#53657a" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="40" y="54" width="235" height="182" rx="18" fill="#eaf2ff" stroke="#2463a6" stroke-width="3"/><circle cx="65" cy="81" r="15" fill="#2463a6"/><text x="65" y="87" text-anchor="middle" class="number">1</text><text x="157.5" y="119" text-anchor="middle" class="heading">値・型</text><text x="157.5" y="145" text-anchor="middle" class="body">入力は何の形か</text><text x="157.5" y="171" text-anchor="middle" class="body">配列</text><text x="157.5" y="197" text-anchor="middle" class="body">object</text></g><g><rect x="335" y="54" width="235" height="182" rx="18" fill="#eaf7f1" stroke="#23734d" stroke-width="3"/><circle cx="360" cy="81" r="15" fill="#23734d"/><text x="360" y="87" text-anchor="middle" class="number">2</text><text x="452.5" y="119" text-anchor="middle" class="heading">条件・関数</text><text x="452.5" y="145" text-anchor="middle" class="body">処理はどう分かれるか</text><text x="452.5" y="171" text-anchor="middle" class="body">値を代入して予測する</text></g><g><rect x="630" y="54" width="235" height="182" rx="18" fill="#eaf2ff" stroke="#2463a6" stroke-width="3"/><circle cx="655" cy="81" r="15" fill="#2463a6"/><text x="655" y="87" text-anchor="middle" class="number">3</text><text x="747.5" y="119" text-anchor="middle" class="heading">await・Locator</text><text x="747.5" y="145" text-anchor="middle" class="body">画面操作を待つ</text><text x="747.5" y="171" text-anchor="middle" class="body">対象要素を特定する</text></g><g><rect x="925" y="54" width="235" height="182" rx="18" fill="#eaf7f1" stroke="#23734d" stroke-width="3"/><circle cx="950" cy="81" r="15" fill="#23734d"/><text x="950" y="87" text-anchor="middle" class="number">4</text><text x="1042.5" y="119" text-anchor="middle" class="heading">Assertion</text><text x="1042.5" y="145" text-anchor="middle" class="body">期待と観測を比べる</text><text x="1042.5" y="171" text-anchor="middle" class="body">可視性だけの限界を知る</text></g></svg>
