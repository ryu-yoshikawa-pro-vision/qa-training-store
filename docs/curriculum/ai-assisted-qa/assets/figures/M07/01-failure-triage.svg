<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc"><title id="title">失敗を原因別に切り分ける</title><desc id="desc">まず最初の異常と後続エラーを分け、再現条件・ログ・トレースを比較して、原因を特定する前に修正しない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#53657a"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#182230}.heading{font-size:21px;font-weight:700}.body{font-size:16px}.number{font-size:16px;font-weight:700;fill:#fff}</style><rect width="1200" height="280" fill="#fff"/><text x="40" y="33" class="heading">失敗を原因別に切り分ける</text><path d="M 283 145 H 323" fill="none" stroke="#53657a" stroke-width="4" marker-end="url(#arrow)"/><path d="M 578 145 H 618" fill="none" stroke="#53657a" stroke-width="4" marker-end="url(#arrow)"/><path d="M 873 145 H 913" fill="none" stroke="#53657a" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="40" y="54" width="235" height="182" rx="18" fill="#eaf2ff" stroke="#2463a6" stroke-width="3"/><circle cx="65" cy="81" r="15" fill="#2463a6"/><text x="65" y="87" text-anchor="middle" class="number">1</text><text x="157.5" y="119" text-anchor="middle" class="heading">最初の異常</text><text x="157.5" y="145" text-anchor="middle" class="body">最初に崩れた箇所</text><text x="157.5" y="171" text-anchor="middle" class="body">後続の連鎖と区別</text></g><g><rect x="335" y="54" width="235" height="182" rx="18" fill="#eaf7f1" stroke="#23734d" stroke-width="3"/><circle cx="360" cy="81" r="15" fill="#23734d"/><text x="360" y="87" text-anchor="middle" class="number">2</text><text x="452.5" y="119" text-anchor="middle" class="heading">再現条件</text><text x="452.5" y="145" text-anchor="middle" class="body">環境・データ・順序</text><text x="452.5" y="171" text-anchor="middle" class="body">変えた項目を記録</text></g><g><rect x="630" y="54" width="235" height="182" rx="18" fill="#eaf2ff" stroke="#2463a6" stroke-width="3"/><circle cx="655" cy="81" r="15" fill="#2463a6"/><text x="655" y="87" text-anchor="middle" class="number">3</text><text x="747.5" y="119" text-anchor="middle" class="heading">証拠を比較</text><text x="747.5" y="145" text-anchor="middle" class="body">ログ・trace・画面</text><text x="747.5" y="171" text-anchor="middle" class="body">期待と観測を分ける</text></g><g><rect x="925" y="54" width="235" height="182" rx="18" fill="#eaf7f1" stroke="#23734d" stroke-width="3"/><circle cx="950" cy="81" r="15" fill="#23734d"/><text x="950" y="87" text-anchor="middle" class="number">4</text><text x="1042.5" y="119" text-anchor="middle" class="heading">仮説を検証</text><text x="1042.5" y="145" text-anchor="middle" class="body">一つずつ確かめる</text><text x="1042.5" y="171" text-anchor="middle" class="body">修正理由を説明する</text></g></svg>
