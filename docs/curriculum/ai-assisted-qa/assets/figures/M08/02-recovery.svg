<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc"><title id="title">誤操作に気づいたときの回復</title><desc id="desc">削除や上書きの可能性に気づいたら追加入力を止め、状態と差分を記録する。復旧方法を確認してから安全に再開する。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#53657a"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#182230}.heading{font-size:21px;font-weight:700}.body{font-size:16px}.number{font-size:16px;font-weight:700;fill:#fff}</style><rect width="1200" height="280" fill="#fff"/><text x="40" y="33" class="heading">誤操作に気づいたときの回復</text><path d="M 283 145 H 323" fill="none" stroke="#53657a" stroke-width="4" marker-end="url(#arrow)"/><path d="M 578 145 H 618" fill="none" stroke="#53657a" stroke-width="4" marker-end="url(#arrow)"/><path d="M 873 145 H 913" fill="none" stroke="#53657a" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="40" y="54" width="235" height="182" rx="18" fill="#eaf2ff" stroke="#2463a6" stroke-width="3"/><circle cx="65" cy="81" r="15" fill="#2463a6"/><text x="65" y="87" text-anchor="middle" class="number">1</text><text x="157.5" y="119" text-anchor="middle" class="heading">停止する</text><text x="157.5" y="145" text-anchor="middle" class="body">追加の操作を止める</text><text x="157.5" y="171" text-anchor="middle" class="body">上書きを重ねない</text></g><g><rect x="335" y="54" width="235" height="182" rx="18" fill="#eaf7f1" stroke="#23734d" stroke-width="3"/><circle cx="360" cy="81" r="15" fill="#23734d"/><text x="360" y="87" text-anchor="middle" class="number">2</text><text x="452.5" y="119" text-anchor="middle" class="heading">状態を読む</text><text x="452.5" y="145" text-anchor="middle" class="body">status</text><text x="452.5" y="171" text-anchor="middle" class="body">diff を確認</text><text x="452.5" y="197" text-anchor="middle" class="body">消えた物と残る物</text></g><g><rect x="630" y="54" width="235" height="182" rx="18" fill="#eaf2ff" stroke="#2463a6" stroke-width="3"/><circle cx="655" cy="81" r="15" fill="#2463a6"/><text x="655" y="87" text-anchor="middle" class="number">3</text><text x="747.5" y="119" text-anchor="middle" class="heading">復旧を選ぶ</text><text x="747.5" y="145" text-anchor="middle" class="body">履歴・バックアップを確認</text><text x="747.5" y="171" text-anchor="middle" class="body">所有者と範囲を守る</text></g><g><rect x="925" y="54" width="235" height="182" rx="18" fill="#eaf7f1" stroke="#23734d" stroke-width="3"/><circle cx="950" cy="81" r="15" fill="#23734d"/><text x="950" y="87" text-anchor="middle" class="number">4</text><text x="1042.5" y="119" text-anchor="middle" class="heading">再開を判断</text><text x="1042.5" y="145" text-anchor="middle" class="body">影響と証拠を記録</text><text x="1042.5" y="171" text-anchor="middle" class="body">安全を説明して進む</text></g></svg>
