name: 不具合報告
description: 再現可能な製品または文書の不具合を報告します。セキュリティ脆弱性にはこのフォームを使用しないでください。
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        セキュリティ脆弱性をPublic Issueへ投稿しないでください。[SECURITY.md](https://github.com/ryu-yoshikawa-pro-vision/qa-training-store/blob/main/SECURITY.md)を確認し、GitHub Private Vulnerability Reportingを使用してください。
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 問題の概要を記載してください。
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: 対象環境
      description: 影響を受ける環境、端末、またはOSを記載してください。
    validations:
      required: true
  - type: textarea
    id: environment-browser
    attributes:
      label: 環境 / ブラウザ
      description: ブラウザとそのバージョン、アプリのバージョン、または関連するruntimeの情報を記載してください。
    validations:
      required: true
  - type: textarea
    id: preconditions
    attributes:
      label: 前提条件
      description: 再現前に必要な設定やデータを記載してください。
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: 再現手順
      description: 確実に再現できる最小限の手順を列挙してください。
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: 期待結果
    validations:
      required: true
  - type: textarea
    id: actual-result
    attributes:
      label: 実際の結果
    validations:
      required: true
  - type: textarea
    id: reproducibility
    attributes:
      label: 再現性
      description: どの程度の頻度で、どの条件で発生するかを記載してください。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 根拠・確認材料
      description: 公開して安全なログ、スクリーンショット、リンク、その他の確認材料を追加してください。
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: 補足
      description: 公開して安全なその他の情報を追加してください。
