name: Feature request
description: Suggest a product, documentation, or training improvement. Do not use this form for security vulnerabilities.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities in a public Issue. Use [SECURITY.md](https://github.com/ryu-yoshikawa-pro-vision/qa-training-store/blob/main/SECURITY.md) and GitHub Private Vulnerability Reporting instead.
  - type: textarea
    id: problem-motivation
    attributes:
      label: Problem / Motivation
      description: What problem would this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: Describe the behavior or outcome you would like.
    validations:
      required: true
  - type: textarea
    id: scope-constraints
    attributes:
      label: Scope / Constraints
      description: Note affected areas, non-goals, compatibility, or implementation constraints.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, links, screenshots, or other context that is safe to share publicly.
