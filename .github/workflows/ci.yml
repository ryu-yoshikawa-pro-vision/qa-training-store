name: Web CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  NODE_VERSION: "24"
  PNPM_VERSION: "9.10.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          vulnerability-check: true
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          license-check: false
          show-openssf-scorecard: false
          comment-summary-in-pr: never

  style-quality:
    name: Style Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Specification impact summary
        env:
          SPEC_IMPACT_EVENT_NAME: ${{ github.event_name }}
          SPEC_IMPACT_BASE_BRANCH: ${{ github.base_ref }}
          SPEC_IMPACT_EVENT_BEFORE: ${{ github.event.before }}
        run: pnpm run summarize:spec-impact

      - name: Format check
        run: pnpm run format:check

      - name: Markdown lint
        run: pnpm run lint:markdown

      - name: Skill package validation
        run: pnpm run validate:skills

      - name: Specification and Agentic QA validation
        run: pnpm run validate:spec

      - name: Final Visual Specification gate
        run: pnpm run validate:spec-visuals:final
      - name: Curriculum validation
        run: pnpm run validate:curriculum

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Validate image manifest
        run: pnpm run validate:image-manifest

      - name: Security check
        run: pnpm run security:check

  codex-artifact-sanitization:
    name: Codex artifact sanitization (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test Codex artifact sanitizer
        shell: pwsh
        run: ./scripts/tests/codex-artifact-sanitizer.test.ps1

      - name: Check changed Codex artifacts
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EVENT_NAME -eq "pull_request") {
            $base = "origin/$env:BASE_REF"
          }
          else {
            $base = $env:EVENT_BEFORE
            if ([string]::IsNullOrWhiteSpace($base) -or $base -match "^0+$") {
              $base = "HEAD^"
            }
          }

          $files = @(
            # This scope includes .codex/runs/**/PLAN.md, .codex/runs/**/REPORT.md, and other text artifacts.
            git diff --name-only --diff-filter=ACMRTUXB "$base...HEAD" -- ".codex/runs"
          ) | Where-Object {
            Test-Path -LiteralPath $_
          }

          if ($files.Count -gt 0) {
            ./scripts/sanitize-codex-artifacts.ps1 -Path $files -Check
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          else {
            Write-Output "No changed Codex Run Artifact files to check."
          }

  vitest:
    name: Vitest (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - unit
          - integration
          - repository
          - component
          - contracts
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Vitest suite
        run: pnpm run test:${{ matrix.suite }}

  build-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_APP_ENV: automation
      EXPO_PUBLIC_BUILD_KIND: automation
      EXPO_PUBLIC_TEST_MODE: "true"
      EXPO_PUBLIC_DEFAULT_SEED: default
      EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build automation web
        run: pnpm run build:web

      - name: Build specification site
        run: pnpm run build:spec

      - name: Verify specification artifact
        run: test -f output/spec-site/index.html

      - name: Verify automation artifact
        run: test -f dist/index.html

      - name: Upload automation artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: web-dist-automation
          path: dist
          if-no-files-found: error
          retention-days: 3

      - name: Upload specification artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: spec-site-automation
          path: output/spec-site
          if-no-files-found: error
          retention-days: 3

  build-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_BUILD_KIND: production
      EXPO_PUBLIC_TEST_MODE: "false"
      EXPO_PUBLIC_DEFAULT_SEED: default
      EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build production web
        run: pnpm run build:web

      - name: Verify production artifact
        run: test -f dist/index.html

      - name: Upload production artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: web-dist-production
          path: dist
          if-no-files-found: error
          retention-days: 3

  e2e-chromium:
    name: Chromium E2E (${{ matrix.name }})
    needs: build-automation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: required
            command: pnpm run test:e2e:chromium
          - name: accessibility
            command: pnpm run test:a11y
          - name: mobile-boundary
            command: pnpm run test:e2e:mobile-boundary
          - name: cross-role
            command: pnpm run test:e2e:cross-role
          - name: training-web-baseline
            command: pnpm run training:web:baseline
    env:
      PLAYWRIGHT_USE_PREBUILT_DIST: "true"
      EXPO_PUBLIC_APP_ENV: automation
      EXPO_PUBLIC_BUILD_KIND: automation
      EXPO_PUBLIC_TEST_MODE: "true"
      EXPO_PUBLIC_DEFAULT_SEED: default
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download automation artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-dist-automation
          path: dist

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Verify Agentic QA deterministic preparation
        if: matrix.name == 'required'
        run: pnpm run test:agentic-qa:preparation

      - name: Run Chromium E2E
        env:
          PLAYWRIGHT_BASE_URL: ${{ matrix.name == 'training-web-baseline' && 'http://127.0.0.1:8082' || 'http://127.0.0.1:8081' }}
        run: ${{ matrix.command }}

      - name: Upload Playwright artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Training Web artifacts on failure
        if: ${{ failure() && matrix.name == 'training-web-baseline' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: training-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/training/playwright
          if-no-files-found: warn
          retention-days: 14

  ui-review:
    name: UI Review (${{ matrix.project }})
    needs: build-automation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - project: ui-review-desktop
            viewport: desktop
          - project: ui-review-tablet
            viewport: tablet
          - project: ui-review-mobile
            viewport: mobile
          - project: ui-review-small-mobile
            viewport: small-mobile
    env:
      PLAYWRIGHT_USE_PREBUILT_DIST: "true"
      UI_REVIEW_STAGE: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download automation artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-dist-automation
          path: dist

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Capture UI review screenshots
        run: pnpm exec playwright test e2e/web/ui-review.spec.ts --project="${{ matrix.project }}" --workers=1

      - name: Upload UI review screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ui-review-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ui-review/${{ env.UI_REVIEW_STAGE }}/${{ matrix.viewport }}
          if-no-files-found: warn
          retention-days: 14

  production-smoke:
    needs: build-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_USE_PREBUILT_DIST: "true"
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_BUILD_KIND: production
      EXPO_PUBLIC_TEST_MODE: "false"
      EXPO_PUBLIC_DEFAULT_SEED: default
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download production artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-dist-production
          path: dist

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Smoke production artifact locally
        run: pnpm run test:smoke

      - name: Upload Playwright artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-production-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright
          if-no-files-found: warn
          retention-days: 14

  extended-e2e:
    if: github.event_name != 'pull_request'
    name: Extended E2E (mobile-chromium)
    needs: build-automation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_USE_PREBUILT_DIST: "true"
      EXPO_PUBLIC_APP_ENV: automation
      EXPO_PUBLIC_BUILD_KIND: automation
      EXPO_PUBLIC_TEST_MODE: "true"
      EXPO_PUBLIC_DEFAULT_SEED: default
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download automation artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-dist-automation
          path: dist

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Run extended E2E
        run: pnpm run test:e2e:mobile

      - name: Upload Playwright artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-mobile-chromium-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright
          if-no-files-found: warn
          retention-days: 14

  verify:
    needs:
      - dependency-review
      - style-quality
      - code-quality
      - vitest
      - build-automation
      - build-production
      - codex-artifact-sanitization
      - e2e-chromium
      - ui-review
      - production-smoke
      - extended-e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required job results
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          STYLE_QUALITY_RESULT: ${{ needs.style-quality.result }}
          CODE_QUALITY_RESULT: ${{ needs.code-quality.result }}
          CODEX_ARTIFACT_RESULT: ${{ needs.codex-artifact-sanitization.result }}
          VITEST_RESULT: ${{ needs.vitest.result }}
          BUILD_AUTOMATION_RESULT: ${{ needs.build-automation.result }}
          BUILD_PRODUCTION_RESULT: ${{ needs.build-production.result }}
          E2E_CHROMIUM_RESULT: ${{ needs.e2e-chromium.result }}
          UI_REVIEW_RESULT: ${{ needs.ui-review.result }}
          PRODUCTION_SMOKE_RESULT: ${{ needs.production-smoke.result }}
          EXTENDED_E2E_RESULT: ${{ needs.extended-e2e.result }}
        run: |
          set -euo pipefail

          require_success() {
            local job_name="$1"
            local result="$2"

            if [[ "$result" != "success" ]]; then
              echo "::error title=Required CI job failed::${job_name} result was ${result}"
              exit 1
            fi
          }

          require_success "style-quality" "$STYLE_QUALITY_RESULT"
          require_success "code-quality" "$CODE_QUALITY_RESULT"
          require_success "codex-artifact-sanitization" "$CODEX_ARTIFACT_RESULT"
          require_success "vitest" "$VITEST_RESULT"
          require_success "build-automation" "$BUILD_AUTOMATION_RESULT"
          require_success "build-production" "$BUILD_PRODUCTION_RESULT"
          require_success "e2e-chromium" "$E2E_CHROMIUM_RESULT"
          require_success "ui-review" "$UI_REVIEW_RESULT"
          require_success "production-smoke" "$PRODUCTION_SMOKE_RESULT"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            require_success "dependency-review" "$DEPENDENCY_REVIEW_RESULT"
          else
            if [[ "$DEPENDENCY_REVIEW_RESULT" != "skipped" ]]; then
              echo "::error title=Invalid Dependency Review result::dependency-review result was ${DEPENDENCY_REVIEW_RESULT}"
              exit 1
            fi
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$EXTENDED_E2E_RESULT" != "success" && "$EXTENDED_E2E_RESULT" != "skipped" ]]; then
              echo "::error title=Invalid extended E2E result::extended-e2e result was ${EXTENDED_E2E_RESULT}"
              exit 1
            fi
          else
            require_success "extended-e2e" "$EXTENDED_E2E_RESULT"
          fi

          echo "All required CI jobs completed successfully."

  deploy-preview:
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      needs.verify.result == 'success' &&
      needs.build-automation.result == 'success'
    needs:
      - verify
      - build-automation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_USE_PREBUILT_DIST: "true"
      EXPO_PUBLIC_APP_ENV: automation
      EXPO_PUBLIC_BUILD_KIND: automation
      EXPO_PUBLIC_TEST_MODE: "true"
      EXPO_PUBLIC_DEFAULT_SEED: default
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download automation artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-dist-automation
          path: dist

      - name: Validate Preview branch name
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_HEAD_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error title=Invalid Preview branch name::Unsupported characters were found."
            exit 1
          fi

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error title=Missing Cloudflare credentials::Cloudflare credentials are required."
            exit 1
          fi

      - name: Deploy Cloudflare Preview
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.90.0"
          command: >-
            pages deploy dist
            --project-name=ec-test-automation-store
            --branch=${{ github.head_ref }}

      - name: Validate preview deployment URL
        env:
          DEPLOYED_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [[ -z "$DEPLOYED_BASE_URL" ]]; then
            echo "::error title=Missing preview deployment URL::Cloudflare did not return a deployment URL."
            exit 1
          fi

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Smoke deployed preview
        env:
          DEPLOYED_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: pnpm run test:smoke

  validate:
    if: always()
    needs:
      - verify
      - deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate final workflow results
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          DEPLOY_PREVIEW_RESULT: ${{ needs.deploy-preview.result }}
        run: |
          set -euo pipefail

          require_success() {
            local job_name="$1"
            local result="$2"

            if [[ "$result" != "success" ]]; then
              echo "::error title=Required CI job failed::${job_name} result was ${result}"
              exit 1
            fi
          }

          require_success "verify" "$VERIFY_RESULT"

          require_skipped() {
            local job_name="$1"
            local result="$2"

            if [[ "$result" != "skipped" ]]; then
              echo "::error title=Expected job to be skipped::${job_name} result was ${result}"
              exit 1
            fi
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_HEAD_REPO_FULL_NAME" == "$REPOSITORY" && "$PR_AUTHOR_LOGIN" != "dependabot[bot]" ]]; then
              require_success "deploy-preview" "$DEPLOY_PREVIEW_RESULT"
            elif [[ "$PR_AUTHOR_LOGIN" == "dependabot[bot]" ]]; then
              require_skipped "deploy-preview" "$DEPLOY_PREVIEW_RESULT"
            elif [[ "$PR_HEAD_REPO_FULL_NAME" != "$REPOSITORY" ]]; then
              require_skipped "deploy-preview" "$DEPLOY_PREVIEW_RESULT"
            else
              echo "::error title=Unexpected Pull Request classification::Could not classify the pull_request Preview contract."
              exit 1
            fi
          elif [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            require_skipped "deploy-preview" "$DEPLOY_PREVIEW_RESULT"
          else
            echo "::error title=Unexpected workflow event::Unsupported event ${EVENT_NAME}."
            exit 1
          fi

          echo "All required validation and deployment checks completed successfully."

  deploy-production:
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.validate.result == 'success' &&
      needs.build-production.result == 'success'
    needs:
      - validate
      - build-production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_USE_PREBUILT_DIST: "true"
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_BUILD_KIND: production
      EXPO_PUBLIC_TEST_MODE: "false"
      EXPO_PUBLIC_DEFAULT_SEED: default
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download production artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-dist-production
          path: dist

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error title=Missing Cloudflare credentials::Cloudflare credentials are required."
            exit 1
          fi

      - name: Deploy Cloudflare Production
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.90.0"
          command: >-
            pages deploy dist
            --project-name=ec-test-automation-store
            --branch=main

      - name: Validate production deployment URL
        env:
          DEPLOYED_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [[ -z "$DEPLOYED_BASE_URL" ]]; then
            echo "::error title=Missing production deployment URL::Cloudflare did not return a deployment URL."
            exit 1
          fi

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Smoke deployed production
        env:
          DEPLOYED_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: pnpm run test:smoke
