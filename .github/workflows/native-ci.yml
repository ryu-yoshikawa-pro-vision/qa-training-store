name: Native CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      capture_spec_visuals:
        description: Capture canonical Screen Catalog Android visuals
        required: false
        type: boolean
        default: false
      capture_case_key:
        description: Registry Android Capture Case key, or all for every Android target
        required: false
        type: string
        default: SCREEN-STOREFRONT-HOME/default/android

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PNPM_VERSION: 9.10.0
  EXPO_DOCTOR_VERSION: 1.17.6
  MAESTRO_VERSION: 2.8.0
  MAESTRO_DOWNLOAD_URL: https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.8.0/maestro.zip
  MAESTRO_CACHE_SCHEMA: v1

jobs:
  detect:
    name: Detect Native Changes
    runs-on: ubuntu-24.04
    outputs:
      native_changed: ${{ steps.paths.outputs.native_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        name: Check Native paths
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- \
            'app/**/*.native.tsx' \
            'src/application/**' \
            'src/domain/**' \
            'src/seeds/**' \
            'src/config/**' \
            'src/presentation/design/**' \
            'src/generated/**' \
            'config/**' \
            'public/images/product-image-manifest.json' \
            'public/images/products/**' \
            'public/images/placeholder.svg' \
            'android/app/build.gradle' \
            'android/app/proguard-rules.pro' \
            'android/app/src/**' \
            'android/build.gradle' \
            'android/settings.gradle' \
            'android/gradle.properties' \
            'android/gradle/wrapper/**' \
            'android/gradlew' \
            'eas.json' \
            '.eas/workflows/**' \
            'scripts/generate-native-asset-map.ts' \
            'scripts/validate-image-manifest.ts' \
            'scripts/validate-eas-static-config.ts' \
            'scripts/check-native-route-dependencies.ts' \
            'scripts/validate-native-production-bundle.ts' \
            'src/**/*.native.ts' \
            'src/**/*.native.tsx' \
            'src/bootstrap/native-runtime.ts' \
            'src/infrastructure/database/sqlite/**' \
            'src/infrastructure/normalization/normalizers.ts' \
            'src/infrastructure/address-lookup/static-address-lookup.ts' \
            'src/infrastructure/payment/mock-payment-gateway.ts' \
            'src/infrastructure/session/native-stores.ts' \
            'src/infrastructure/security/password-hasher.native.ts' \
            'src/test-controls/**' \
            'tests/component/native/**' \
            'tests/contracts/native-*.test.ts' \
            'tests/contracts/native-ci-workflow.test.ts' \
            'src/presentation/native/**' \
            'src/presentation/return-to.ts' \
            'app.config.ts' \
            'metro.config.*' \
            'package.json' \
            'pnpm-lock.yaml' \
            'maestro/**' \
            '.github/workflows/native-ci.yml' \
            '.github/workflows/native-ios-ci.yml'; then
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
          fi

  native-static:
    name: Native Static
    needs: detect
    if: needs.detect.outputs.native_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Native assets
        run: pnpm run generate:native-assets
      - name: Verify generated Native assets
        run: git diff --exit-code -- src/generated/native-product-assets.ts
      - name: Validate image manifest
        run: pnpm run validate:image-manifest
      - name: Run Native component tests
        run: pnpm run test:component:native
      - name: Check Native route dependencies
        run: pnpm run check:native-route-dependencies
      - name: Validate EAS config
        run: pnpm run validate:eas:config
      - name: Run Expo Doctor
        run: pnpm dlx expo-doctor@${{ env.EXPO_DOCTOR_VERSION }}

  production-bundle-guard:
    name: Production Bundle Guard
    needs: detect
    if: needs.detect.outputs.native_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Production Bundle Guard
        run: pnpm run validate:native-production-bundle

  android-automation-build:
    name: Android Automation Build
    needs: detect
    if: needs.detect.outputs.native_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_APP_ENV: automation
      EXPO_PUBLIC_BUILD_KIND: automation
      EXPO_PUBLIC_TEST_MODE: "true"
      EXPO_PUBLIC_DEFAULT_SEED: default
      ANDROID_COMPILE_API_LEVEL: "36"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Automation runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec expo config --json > "$RUNNER_TEMP/android-automation-config.json"
          node -e 'const fs = require("node:fs"); const extra = JSON.parse(fs.readFileSync(process.argv[1], "utf8")).extra ?? {}; for (const [key, expected] of Object.entries({ appEnvironment: "automation", buildKind: "automation", testMode: "true" })) { if (extra[key] !== expected) throw new Error(`${key}=${extra[key] ?? "<missing>"}, expected ${expected}`); }' "$RUNNER_TEMP/android-automation-config.json"
      - name: Run Expo prebuild
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Resolve Android SDK and sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          ADB="$SDK_ROOT/platform-tools/adb"
          APK_PATH="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ADB=$ADB" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/platform-tools:$(dirname "$SDKMANAGER"):$PATH"
          echo "Resolved Android SDK: $SDK_ROOT"
          echo "Resolved sdkmanager: $SDKMANAGER"
      - name: Install Android SDK build components
        shell: bash
        run: |
          set -euo pipefail
          test -x "$SDKMANAGER"
          missing_components=()
          if [[ ! -x "$SDK_ROOT/platform-tools/adb" ]]; then
            missing_components+=("platform-tools")
          fi
          if [[ ! -f "$SDK_ROOT/platforms/android-${ANDROID_COMPILE_API_LEVEL}/android.jar" ]]; then
            missing_components+=("platforms;android-${ANDROID_COMPILE_API_LEVEL}")
          fi
          if [[ ! -x "$SDK_ROOT/build-tools/36.0.0/aapt" ]]; then
            missing_components+=("build-tools;36.0.0")
          fi
          if ((${#missing_components[@]} == 0)); then
            echo "All required Android SDK build components are already installed; skipping download."
            exit 0
          fi
          printf 'Missing Android SDK build components:\n - %s\n' "${missing_components[@]}"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$SDKMANAGER" "${missing_components[@]}"
      - name: Verify Android SDK build components
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          echo "ADB=$ADB"
          echo "APK_PATH=$APK_PATH"
          test -d "$SDK_ROOT"
          test -d "$ANDROID_HOME"
          test -x "$SDKMANAGER"
          test -f "$SDK_ROOT/platforms/android-${ANDROID_COMPILE_API_LEVEL}/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt"
          ls -la "$ANDROID_HOME/platform-tools"
          ls -la "$SDK_ROOT/platforms/android-${ANDROID_COMPILE_API_LEVEL}"
          ls -la "$SDK_ROOT/build-tools/36.0.0"
      - name: Build Automation Release APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=x86_64 \
            --build-cache \
            --parallel \
            --stacktrace \
            2>&1 | tee "$RUNNER_TEMP/gradle-assemble-release.log"
      - name: Verify Automation Release APK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$APK_PATH"
          test -s "$APK_PATH"
          if ! unzip -l "$APK_PATH" | grep -Eq 'assets/.*\.(bundle|hbc)'; then
            echo "Automation Release APK does not contain a JavaScript bundle." >&2
            unzip -l "$APK_PATH" | tail -n 40 >&2
            exit 1
          fi
          if ! unzip -l "$APK_PATH" | grep -Eq 'lib/x86_64/.*\.so'; then
            echo "Automation Release APK does not contain x86_64 native libraries." >&2
            unzip -l "$APK_PATH" | grep -E '(^|/)lib/' | tail -n 40 >&2
            exit 1
          fi
          if unzip -l "$APK_PATH" | grep -Eq 'lib/(arm64-v8a|armeabi-v7a|x86)/.*\.so'; then
            echo "Automation Release APK contains a non-x86_64 native library." >&2
            unzip -l "$APK_PATH" | grep -E '(^|/)lib/' | tail -n 40 >&2
            exit 1
          fi
          ls -lh "$APK_PATH"
      - name: Save Automation Release APK for Runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-apks"
          cp "$APK_PATH" "$RUNNER_TEMP/native-apks/native-automation.apk"
          echo "AUTOMATION_APK_PATH=$RUNNER_TEMP/native-apks/native-automation.apk" >> "$GITHUB_ENV"
      - name: Upload Automation Release APK
        uses: actions/upload-artifact@v4
        with:
          name: native-android-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/native-apks/native-automation.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Collect Android build evidence
        if: always()
        shell: bash
        env:
          NATIVE_ANDROID_BUILD_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-build-evidence"
          {
            echo "job_status=${NATIVE_ANDROID_BUILD_JOB_STATUS:-unknown}"
            echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
            echo "ANDROID_COMPILE_API_LEVEL=${ANDROID_COMPILE_API_LEVEL:-<unset>}"
            echo "node_version=$(node --version 2>/dev/null || true)"
            echo "java_version=$(java -version 2>&1 | head -n 1 || true)"
          } > "$RUNNER_TEMP/native-build-evidence/android-build-environment.txt"
          gradle_log="$RUNNER_TEMP/gradle-assemble-release.log"
          if [[ -f "$gradle_log" ]]; then
            if [[ "${NATIVE_ANDROID_BUILD_JOB_STATUS:-failure}" == "success" ]]; then
              tail -n 200 "$gradle_log" > "$RUNNER_TEMP/native-build-evidence/gradle-assemble-release.log"
            else
              if ! cp "$gradle_log" "$RUNNER_TEMP/native-build-evidence/gradle-assemble-release.log"; then
                echo "Gradle Release build log copy failed." \
                  > "$RUNNER_TEMP/native-build-evidence/gradle-copy-status.txt"
              fi
            fi
          else
            echo "Gradle Release build log was not generated." \
              > "$RUNNER_TEMP/native-build-evidence/gradle-status.txt"
          fi
          if [[ -n "${APK_PATH:-}" && -f "$APK_PATH" ]]; then
            {
              echo "apk_path=$APK_PATH"
              stat -c 'size_bytes=%s' "$APK_PATH"
              file "$APK_PATH" || true
              unzip -l "$APK_PATH" | grep -E "AndroidManifest.xml|assets/.*\\.(bundle|hbc)|lib/x86_64/.*\\.so" || true
              sha256sum "$APK_PATH" || true
            } > "$RUNNER_TEMP/native-build-evidence/apk-metadata.txt"
            if [[ "${NATIVE_ANDROID_BUILD_JOB_STATUS:-failure}" != "success" ]]; then
              if ! cp "$APK_PATH" "$RUNNER_TEMP/native-build-evidence/native-automation.apk"; then
                echo "Automation Release APK copy failed." \
                  > "$RUNNER_TEMP/native-build-evidence/apk-copy-status.txt"
              fi
            fi
          else
            echo "Automation Release APK was not generated." \
              > "$RUNNER_TEMP/native-build-evidence/apk-status.txt"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-build-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/native-build-evidence
          if-no-files-found: warn
          retention-days: 7

  android-production-build:
    name: Android Production-validation Build
    needs: detect
    if: needs.detect.outputs.native_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_BUILD_KIND: production
      EXPO_PUBLIC_TEST_MODE: "false"
      EXPO_PUBLIC_DEFAULT_SEED: default
      ANDROID_COMPILE_API_LEVEL: "36"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Production runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec expo config --json > "$RUNNER_TEMP/android-production-config.json"
          node -e 'const fs = require("node:fs"); const extra = JSON.parse(fs.readFileSync(process.argv[1], "utf8")).extra ?? {}; for (const [key, expected] of Object.entries({ appEnvironment: "production", buildKind: "production", testMode: "false" })) { if (extra[key] !== expected) throw new Error(`${key}=${extra[key] ?? "<missing>"}, expected ${expected}`); }' "$RUNNER_TEMP/android-production-config.json"
      - name: Run Expo prebuild
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Resolve Android SDK and sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          ADB="$SDK_ROOT/platform-tools/adb"
          APK_PATH="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ADB=$ADB" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/platform-tools:$(dirname "$SDKMANAGER"):$PATH"
          echo "Resolved Android SDK: $SDK_ROOT"
          echo "Resolved sdkmanager: $SDKMANAGER"
      - name: Install Android SDK build components
        shell: bash
        run: |
          set -euo pipefail
          test -x "$SDKMANAGER"
          missing_components=()
          if [[ ! -x "$SDK_ROOT/platform-tools/adb" ]]; then
            missing_components+=("platform-tools")
          fi
          if [[ ! -f "$SDK_ROOT/platforms/android-${ANDROID_COMPILE_API_LEVEL}/android.jar" ]]; then
            missing_components+=("platforms;android-${ANDROID_COMPILE_API_LEVEL}")
          fi
          if [[ ! -x "$SDK_ROOT/build-tools/36.0.0/aapt" ]]; then
            missing_components+=("build-tools;36.0.0")
          fi
          if ((${#missing_components[@]} == 0)); then
            echo "All required Android SDK build components are already installed; skipping download."
            exit 0
          fi
          printf 'Missing Android SDK build components:\n - %s\n' "${missing_components[@]}"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$SDKMANAGER" "${missing_components[@]}"
      - name: Verify Android SDK build components
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          echo "APK_PATH=$APK_PATH"
          test -d "$SDK_ROOT"
          test -d "$ANDROID_HOME"
          test -x "$SDKMANAGER"
          test -f "$SDK_ROOT/platforms/android-${ANDROID_COMPILE_API_LEVEL}/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt"
          ls -la "$ANDROID_HOME/platform-tools"
          ls -la "$SDK_ROOT/platforms/android-${ANDROID_COMPILE_API_LEVEL}"
          ls -la "$SDK_ROOT/build-tools/36.0.0"
      - name: Build Production-validation Release APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=x86_64 \
            --build-cache \
            --parallel \
            --stacktrace \
            2>&1 | tee "$RUNNER_TEMP/gradle-assemble-production-release.log"
      - name: Save Production-validation Release APK for Runtime
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTION_APK_PATH="$RUNNER_TEMP/native-apks/native-production-validation.apk"
          test -f "$APK_PATH"
          test -s "$APK_PATH"
          mkdir -p "$RUNNER_TEMP/native-apks"
          cp "$APK_PATH" "$RUNNER_TEMP/native-apks/native-production-validation.apk"
          echo "PRODUCTION_APK_PATH=$PRODUCTION_APK_PATH" >> "$GITHUB_ENV"
      - name: Verify Production-validation Release APK
        shell: bash
        run: |
          set -euo pipefail
          : "${PRODUCTION_APK_PATH:?Production APK path was not exported by the save step}"
          test -f "$PRODUCTION_APK_PATH"
          test -s "$PRODUCTION_APK_PATH"
          bundle_entries=$(
            unzip -Z1 "$PRODUCTION_APK_PATH" |
              grep -E '^assets/.*\.(bundle|hbc)$' || true
          )
          if [[ -z "$bundle_entries" ]]; then
            echo "Production-validation APK does not contain a JavaScript bundle." >&2
            exit 1
          fi
          test -n "$bundle_entries"
          while IFS= read -r bundle_entry; do
            if unzip -p "$PRODUCTION_APK_PATH" "$bundle_entry" |
              grep -aE '__SCENARIO_SHOP_NATIVE_AUTOMATION__|__SCENARIO_SHOP_NATIVE_CONTRACT_HARNESS__|NativeTestControlService' > /dev/null
            then
              echo "Production-validation APK contains Automation/Test Control markers." >&2
              exit 1
            fi
          done <<< "$bundle_entries"
          ls -lh "$PRODUCTION_APK_PATH"
      - name: Upload Production-validation Release APK
        uses: actions/upload-artifact@v4
        with:
          name: native-android-production-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/native-apks/native-production-validation.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Collect Android production build evidence
        if: always()
        shell: bash
        env:
          NATIVE_ANDROID_PRODUCTION_BUILD_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-production-build-evidence"
          {
            echo "job_status=${NATIVE_ANDROID_PRODUCTION_BUILD_JOB_STATUS:-unknown}"
            echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
            echo "ANDROID_COMPILE_API_LEVEL=${ANDROID_COMPILE_API_LEVEL:-<unset>}"
            echo "node_version=$(node --version 2>/dev/null || true)"
            echo "java_version=$(java -version 2>&1 | head -n 1 || true)"
          } > "$RUNNER_TEMP/native-production-build-evidence/android-build-environment.txt"
          if [[ -f "$RUNNER_TEMP/gradle-assemble-production-release.log" ]]; then
            cp "$RUNNER_TEMP/gradle-assemble-production-release.log" \
              "$RUNNER_TEMP/native-production-build-evidence/gradle-assemble-production-release.log"
          else
            echo "Gradle Production-validation build log was not generated." \
              > "$RUNNER_TEMP/native-production-build-evidence/gradle-production-status.txt"
          fi
          if [[ -n "${PRODUCTION_APK_PATH:-}" && -f "$PRODUCTION_APK_PATH" ]]; then
            {
              echo "production_apk_path=$PRODUCTION_APK_PATH"
              stat -c 'size_bytes=%s' "$PRODUCTION_APK_PATH"
              file "$PRODUCTION_APK_PATH" || true
              sha256sum "$PRODUCTION_APK_PATH" || true
            } > "$RUNNER_TEMP/native-production-build-evidence/production-apk-metadata.txt"
          else
            echo "Production-validation APK was not generated." \
              > "$RUNNER_TEMP/native-production-build-evidence/production-apk-status.txt"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-production-build-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/native-production-build-evidence
          if-no-files-found: warn
          retention-days: 7

  android-runtime:
    name: Android Runtime / Maestro
    needs: [detect, android-automation-build, android-production-build]
    if: >-
      always() &&
      (needs.detect.outputs.native_changed == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.android-automation-build.result == 'success' || needs.android-production-build.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ANDROID_API_LEVEL: "34"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: ${{ inputs.capture_spec_visuals == true }}
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install visual capture dependencies
        if: ${{ inputs.capture_spec_visuals == true }}
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android emulator runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          if dpkg-query -W -f='${Status}' libpulse0 2>/dev/null | grep -q 'install ok installed'; then
            echo "libpulse0 is already installed; skipping apt-get update."
          else
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends libpulse0
          fi
      - name: Resolve Android SDK and sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          AVDMANAGER="$(dirname "$SDKMANAGER")/avdmanager"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ADB=$ADB" >> "$GITHUB_ENV"
          echo "EMULATOR=$EMULATOR" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$(dirname "$SDKMANAGER"):$PATH"
          echo "Resolved Android SDK: $SDK_ROOT"
          echo "Resolved sdkmanager: $SDKMANAGER"
      - name: Install Android SDK emulator components
        shell: bash
        run: |
          set -euo pipefail
          test -x "$SDKMANAGER"
          missing_components=()
          if [[ ! -x "$SDK_ROOT/platform-tools/adb" ]]; then
            missing_components+=("platform-tools")
          fi
          if [[ ! -x "$SDK_ROOT/emulator/emulator" ]]; then
            missing_components+=("emulator")
          fi
          if [[ ! -f "$SDK_ROOT/system-images/android-${ANDROID_API_LEVEL}/google_apis/x86_64/system.img" ]]; then
            missing_components+=("system-images;android-${ANDROID_API_LEVEL};google_apis;x86_64")
          fi
          if ((${#missing_components[@]} == 0)); then
            echo "All required Android SDK emulator components are already installed; skipping download."
            exit 0
          fi
          printf 'Missing Android SDK emulator components:\n - %s\n' "${missing_components[@]}"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$SDKMANAGER" "${missing_components[@]}"
      - name: List installed Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --list_installed
      - name: Verify Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          echo "ADB=$ADB"
          echo "EMULATOR=$EMULATOR"
          echo "AVDMANAGER=$AVDMANAGER"
          test -d "$SDK_ROOT"
          test -d "$ANDROID_HOME"
          test -x "$SDKMANAGER"
          test -x "$ADB"
          test -x "$EMULATOR"
          test -x "$AVDMANAGER"
          ls -la "$ANDROID_HOME/platform-tools"
          ls -la "$ANDROID_HOME/emulator"
          ls -la "$(dirname "$SDKMANAGER")"
      - name: Verify adb
        shell: bash
        run: |
          set -euo pipefail
          "$ADB" version
      - name: Verify avdmanager
        shell: bash
        run: |
          set -euo pipefail
          "$AVDMANAGER" list target
      - name: Inspect emulator binary
        shell: bash
        run: |
          set -u -o pipefail
          version_log="$RUNNER_TEMP/emulator-version.txt"
          set +e
          timeout 15 "$EMULATOR" -version > "$version_log" 2>&1
          version_status=$?
          set -e
          cat "$version_log"
          echo "emulator -version exit code: $version_status"
          if [[ "$version_status" -ne 0 ]]; then
            echo "emulator -version is diagnostic; the Emulator start step is authoritative."
          fi
      - name: Start Android Emulator with KVM
        id: android_emulator_ready
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          export ANDROID_AVD_HOME
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          echo "ANDROID_PREFS_ROOT=${ANDROID_PREFS_ROOT:-<unset>}"
          echo "HOME=${HOME:-<unset>}"

          fail_emulator() {
            echo "$1" >&2
            echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME:-<unset>}" >&2
            echo "ANDROID_PREFS_ROOT=${ANDROID_PREFS_ROOT:-<unset>}" >&2
            echo "HOME=${HOME:-<unset>}" >&2
            echo "emulator -list-avds:" >&2
            if [[ -f "$RUNNER_TEMP/avd-list.txt" ]]; then
              cat "$RUNNER_TEMP/avd-list.txt" >&2
            else
              echo "<not captured>" >&2
            fi
            echo "AVD files:" >&2
            if [[ -d "${ANDROID_AVD_HOME:-}" ]]; then
              find "$ANDROID_AVD_HOME" -maxdepth 3 -print >&2
            else
              echo "<missing>" >&2
            fi
            if [[ -f "$RUNNER_TEMP/emulator.log" ]]; then
              echo "emulator.log (tail):" >&2
              tail -n 200 "$RUNNER_TEMP/emulator.log" >&2
            fi
            exit 1
          }

          if [[ -e /dev/kvm ]]; then
            ls -l /dev/kvm
          else
            fail_emulator "/dev/kvm is not available."
          fi
          sudo chmod 666 /dev/kvm
          if ! printf 'no\n' | timeout 120 "$AVDMANAGER" create avd \
            -n native-api34 \
            -k "system-images;android-${ANDROID_API_LEVEL};google_apis;x86_64" \
            -p "$ANDROID_AVD_HOME/native-api34.avd" \
            --device "pixel_2" \
            --force; then
            fail_emulator "Android AVD creation failed."
          fi
          find "$ANDROID_AVD_HOME" -maxdepth 3 -type f -print \
            | tee "$RUNNER_TEMP/avd-files.txt"
          if [[ ! -f "$ANDROID_AVD_HOME/native-api34.ini" || ! -d "$ANDROID_AVD_HOME/native-api34.avd" ]]; then
            fail_emulator "AVD files were not created in ANDROID_AVD_HOME."
          fi
          set +e
          "$EMULATOR" -list-avds | tee "$RUNNER_TEMP/avd-list.txt"
          avd_list_status=${PIPESTATUS[0]}
          set -e
          if [[ "$avd_list_status" -ne 0 ]] || ! grep -Fxq "native-api34" "$RUNNER_TEMP/avd-list.txt"; then
            fail_emulator "Android Emulator did not recognize native-api34."
          fi
          "$EMULATOR" \
            -avd native-api34 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            >"$RUNNER_TEMP/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          echo "EMULATOR_PID=$EMULATOR_PID" | tee "$RUNNER_TEMP/emulator-pid.txt"
          echo "EMULATOR_PID=$EMULATOR_PID" >> "$GITHUB_ENV"

          adb_ready=false
          for _ in $(seq 1 90); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              fail_emulator "Android Emulator terminated before ADB became available."
            fi
            if "$ADB" get-state >/dev/null 2>&1; then
              adb_ready=true
              break
            fi
            sleep 2
          done
          if [[ "$adb_ready" != true ]]; then
            fail_emulator "Android Emulator did not become available through ADB."
          fi
          "$ADB" get-state
          "$ADB" devices -l

          boot_completed=false
          for _ in $(seq 1 150); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              fail_emulator "Android Emulator terminated before Android boot completed."
            fi
            boot_state=""
            if boot_state=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r"); then
              if [[ "$boot_state" == "1" ]]; then
                boot_completed=true
                break
              fi
            fi
            sleep 2
          done
          if [[ "$boot_completed" != true ]]; then
            fail_emulator "Android Emulator did not report sys.boot_completed=1."
          fi
          "$ADB" shell getprop sys.boot_completed
          "$ADB" shell getprop ro.build.version.sdk
          "$ADB" shell getprop ro.product.cpu.abi

          package_service_ready=false
          for _ in $(seq 1 90); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              fail_emulator "Android Emulator terminated before the package service became available."
            fi
            if "$ADB" shell service check package 2>/dev/null | grep -q "found"; then
              package_service_ready=true
              break
            fi
            sleep 2
          done
          if [[ "$package_service_ready" != true ]]; then
            fail_emulator "Android package service did not become available."
          fi
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          "$ADB" shell input keyevent 82
      - name: Cache pinned Maestro CLI
        uses: actions/cache@v4
        with:
          path: ~/.cache/maestro/${{ env.MAESTRO_VERSION }}
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}-${{ env.MAESTRO_CACHE_SCHEMA }}
      - name: Install pinned Maestro CLI
        id: maestro_cli
        shell: bash
        run: |
          set -euo pipefail
          MAESTRO_HOME="$HOME/.cache/maestro/$MAESTRO_VERSION"
          MAESTRO_BIN="$MAESTRO_HOME/maestro/bin/maestro"
          MAESTRO_BIN_DIR="$MAESTRO_HOME/maestro/bin"
          mkdir -p "$MAESTRO_HOME"
          cache_valid=false
          if [[ -x "$MAESTRO_BIN" ]]; then
            set +e
            "$MAESTRO_BIN" --version
            maestro_status=$?
            set -e
            if [[ "$maestro_status" -eq 0 ]]; then
              cache_valid=true
              echo "Maestro cache hit: $MAESTRO_HOME"
            else
              echo "Cached Maestro CLI is invalid; rebuilding it from the pinned release."
            fi
          fi
          if [[ "$cache_valid" != true ]]; then
            curl --fail --location --retry 3 \
              "$MAESTRO_DOWNLOAD_URL" \
              --output "$RUNNER_TEMP/maestro.zip"
            unzip -q -o "$RUNNER_TEMP/maestro.zip" -d "$MAESTRO_HOME"
          fi
          test -x "$MAESTRO_BIN"
          "$MAESTRO_BIN" --version
          echo "$MAESTRO_BIN_DIR" >> "$GITHUB_PATH"
          echo "MAESTRO_BIN=$MAESTRO_BIN" >> "$GITHUB_ENV"
      - name: Check Android adb root capability
        id: android_adb_root
        if: ${{ !cancelled() && inputs.capture_spec_visuals == true && steps.android_emulator_ready.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/native-runtime-evidence"
          mkdir -p "$evidence_dir"
          root_output="$evidence_dir/adb-root.txt"
          set +e
          "$ADB" root > "$root_output" 2>&1
          root_command_status=$?
          set -e
          "$ADB" wait-for-device
          sleep 2
          root_id="$("$ADB" shell id | tr -d '\r')"
          root_uid="$("$ADB" shell id -u | tr -d '\r')"
          build_type="$("$ADB" shell getprop ro.build.type | tr -d '\r')"
          build_flavor="$("$ADB" shell getprop ro.build.flavor | tr -d '\r')"
          {
            echo "adb_root_exit=$root_command_status"
            echo "adb_shell_id=$root_id"
            echo "adb_shell_uid=$root_uid"
            echo "build_type=$build_type"
            echo "build_flavor=$build_flavor"
          } | tee -a "$root_output"
          root_available=false
          if [[ "$root_uid" = "0" ]] && printf '%s\n' "$root_id" | grep -Eq 'uid=0\(root\)'; then
            root_available=true
          fi
          echo "adb_root_available=$root_available" | tee -a "$root_output"
          echo "adb_root_available=$root_available" >> "$GITHUB_OUTPUT"
          echo "ADB_ROOT_AVAILABLE=$root_available" >> "$GITHUB_ENV"
      - name: Normalize Android canonical visual profile
        id: android_profile_normalize
        if: ${{ !cancelled() && inputs.capture_spec_visuals == true && steps.android_emulator_ready.outcome == 'success' && steps.maestro_cli.outcome == 'success' && steps.android_adb_root.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/native-runtime-evidence"
          mkdir -p "$evidence_dir"
          provisioning_mode="settings_ui"
          if [[ "${ADB_ROOT_AVAILABLE:-false}" = true ]]; then
            provisioning_mode="adb_root"
            "$ADB" shell setprop persist.sys.locale ja-JP
            "$ADB" shell stop
            sleep 2
            "$ADB" shell start
          else
            "$ADB" shell am force-stop com.android.settings
            "$ADB" shell am start -a android.settings.LOCALE_SETTINGS
            locale_flow_output="$RUNNER_TEMP/locale-provisioning"
            mkdir -p "$locale_flow_output"
            "$MAESTRO_BIN" test \
              --test-output-dir="$locale_flow_output" \
              --format junit \
              --output "$locale_flow_output/locale-provisioning.xml" \
              "$GITHUB_WORKSPACE/maestro/android-locale-provision.yaml"
            "$ADB" shell am force-stop com.android.settings
          fi
          if [[ "$provisioning_mode" = "adb_root" ]]; then
            "$ADB" unroot
            "$ADB" wait-for-device
            sleep 2
          fi
          observation_shell_id="$("$ADB" shell id | tr -d '\r')"
          observation_shell_uid="$("$ADB" shell id -u | tr -d '\r')"
          {
            echo "locale_observation_shell_id=$observation_shell_id"
            echo "locale_observation_shell_uid=$observation_shell_uid"
          } | tee -a "$evidence_dir/adb-root.txt"
          test "$observation_shell_uid" != "0"
          boot_completed=false
          for _ in $(seq 1 90); do
            if [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              boot_completed=true
              break
            fi
            sleep 2
          done
          test "$boot_completed" = true
          package_service_ready=false
          for _ in $(seq 1 90); do
            if "$ADB" shell service check package 2>/dev/null | grep -q "found"; then
              package_service_ready=true
              break
            fi
            sleep 2
          done
          test "$package_service_ready" = true
          settings_service_ready=false
          for _ in $(seq 1 90); do
            if "$ADB" shell service check settings 2>/dev/null | grep -Eq ':[[:space:]]+found[[:space:]]*$'; then
              settings_service_ready=true
              break
            fi
            sleep 2
          done
          test "$settings_service_ready" = true
          "$ADB" shell settings put system font_scale 1.0
          "$ADB" shell cmd uimode night no
          "$ADB" shell settings put system accelerometer_rotation 0
          "$ADB" shell settings put system user_rotation 0
          "$ADB" shell wm density 440
          api_level="$($ADB shell getprop ro.build.version.sdk | tr -d '\r')"
          abi="$($ADB shell getprop ro.product.cpu.abi | tr -d '\r')"
          locale_value="$($ADB shell getprop persist.sys.locale | tr -d '\r')"
          locale_settings="$($ADB shell settings get system system_locales | tr -d '\r')"
          # Observe the effective ActivityManager configuration through the non-root shell.
          # API34 google_apis exposes the applied locale here as [ja_JP].
          effective_locale_observation="dumpsys activity activities"
          effective_config="$($ADB shell dumpsys activity activities | tr -d '\r')"
          effective_locale="unknown"
          for _ in $(seq 1 30); do
            if printf '%s\n' "$effective_config" | grep -Eq '\[(ja_JP|ja-JP)(,|\])' ; then
              effective_locale="ja-JP"
            else
              effective_locale="unknown"
            fi
            if [[ "$effective_locale" = "ja-JP" ]]; then
              break
            fi
            sleep 1
            locale_settings="$($ADB shell settings get system system_locales | tr -d '\r')"
            effective_config="$($ADB shell dumpsys activity activities | tr -d '\r')"
          done
          font_scale="$($ADB shell settings get system font_scale | tr -d '\r')"
          night_mode="$($ADB shell cmd uimode night | tr -d '\r')"
          resolution="$($ADB shell wm size | sed -n 's/.*Physical size: //p' | head -n 1 | tr -d '\r')"
          density="$($ADB shell wm density | sed -n 's/.*Override density: //p' | head -n 1 | tr -d '\r')"
          effective_orientation="unknown"
          if printf '%s\n' "$effective_config" | grep -Eq '(^|[[:space:]])port([[:space:]]|$)' ; then
            effective_orientation="portrait"
          elif printf '%s\n' "$effective_config" | grep -Eq '(^|[[:space:]])land([[:space:]]|$)' ; then
            effective_orientation="landscape"
          fi
          case "$night_mode" in
            *yes*) ui_mode="dark" ;;
            *no*) ui_mode="light" ;;
            *) echo "Unable to normalize Android UI mode from: $night_mode" >&2; exit 1 ;;
          esac
          case "$effective_orientation" in
            portrait|landscape) orientation="$effective_orientation" ;;
            *) echo "Unable to normalize Android orientation from effective configuration." >&2; exit 1 ;;
          esac
          echo "api_level=$api_level"
          echo "abi=$abi"
          echo "locale_provisioning_mode=$provisioning_mode"
          echo "locale_property=$locale_value"
          echo "locale_settings=$locale_settings"
          echo "locale_observation_source=$effective_locale_observation"
          echo "locale_effective=$effective_locale"
          echo "font_scale=$font_scale"
          echo "ui_mode=$ui_mode"
          echo "orientation=$orientation"
          echo "resolution=$resolution"
          echo "density=$density"
          test "$api_level" = "34"
          test "$abi" = "x86_64"
          test "$effective_locale" = "ja-JP"
          test "$font_scale" = "1.0"
          test -n "$resolution"
          test -n "$density"
          profile_json="$RUNNER_TEMP/android-observed-profile.json"
          jq -n \
            --arg api_level "$api_level" \
            --arg abi "$abi" \
            --arg resolution "$resolution" \
            --arg density "$density" \
            --arg locale "$effective_locale" \
            --arg font_scale "$font_scale" \
            --arg ui_mode "$ui_mode" \
            --arg orientation "$orientation" \
            '{api_level: ($api_level | tonumber), abi: $abi, resolution: $resolution, density: ($density | tonumber), locale: $locale, font_scale: ($font_scale | tonumber), ui_mode: $ui_mode, orientation: $orientation}' \
            > "$profile_json"
          pnpm exec tsx scripts/spec/android-visual-capture.ts validate-profile \
            --profile-json "$profile_json"
          echo "ANDROID_OBSERVED_PROFILE_JSON=$profile_json" >> "$GITHUB_ENV"
      - name: Download Automation Release APK
        if: ${{ !cancelled() && needs.android-automation-build.result == 'success' && steps.android_emulator_ready.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: native-android-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/native-apk
      - name: Verify downloaded Automation Release APK
        if: ${{ !cancelled() && needs.android-automation-build.result == 'success' && steps.android_emulator_ready.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$RUNNER_TEMP/native-apk/native-automation.apk"
          test -f "$APK_PATH"
          test -s "$APK_PATH"
          if ! unzip -l "$APK_PATH" | grep -Eq 'assets/.*\.(bundle|hbc)'; then
            echo "Downloaded Automation Release APK does not contain a JavaScript bundle." >&2
            unzip -l "$APK_PATH" | tail -n 40 >&2
            exit 1
          fi
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
      - name: Install and launch Automation APK
        id: android_automation_install
        if: ${{ !cancelled() && needs.android-automation-build.result == 'success' && steps.android_emulator_ready.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ID="com.ryuyoshikawa.scenarioshop"
          export PACKAGE_ID
          timeout 15 "$ADB" logcat -c
          timeout 180 "$ADB" install -r "$APK_PATH"
          timeout 15 "$ADB" shell pm path "$PACKAGE_ID" | grep -F 'package:'
          timeout 30 "$ADB" shell monkey \
            -p "$PACKAGE_ID" \
            -c android.intent.category.LAUNCHER \
            1
          set +e
          timeout 60 bash -c '
            for _ in $(seq 1 30); do
              package_pids="$(timeout 10 "$ADB" shell pidof "$PACKAGE_ID" 2>/dev/null)"
              pid_status=$?
              if [[ "$pid_status" -eq 0 && -n "${package_pids//[[:space:]]/}" ]]; then
                printf "%s\n" "$package_pids"
                exit 0
              fi
              sleep 2
            done
            exit 124
          ' > "$RUNNER_TEMP/app-pid.txt"
          launch_status=$?
          set -e
          stability_status=0
          if [[ "$launch_status" -eq 0 ]]; then
            for check in $(seq 1 6); do
              set +e
              package_pids="$(timeout 10 "$ADB" shell pidof "$PACKAGE_ID" 2>/dev/null)"
              pid_status=$?
              set -e
              if [[ "$pid_status" -ne 0 || -z "${package_pids//[[:space:]]/}" ]]; then
                echo "Android application terminated during startup stability check (sample $check/6)." >&2
                stability_status=1
                break
              fi
              echo "Android application process is alive (sample $check/6): $package_pids"
              if [[ "$check" -lt 6 ]]; then
                sleep 2
              fi
            done
          fi
          set +e
          timeout 30 "$ADB" logcat -d > "$RUNNER_TEMP/app-launch-logcat.txt" 2>&1
          logcat_status=$?
          set -e
          if [[ "$launch_status" -ne 0 || "$stability_status" -ne 0 ]]; then
            echo "Android application process did not remain alive after launch (wait=$launch_status, stability=$stability_status)." >&2
            if [[ -f "$RUNNER_TEMP/app-pid.txt" ]]; then
              cat "$RUNNER_TEMP/app-pid.txt" >&2
            fi
            cat "$RUNNER_TEMP/app-launch-logcat.txt" >&2
            if [[ "$launch_status" -ne 0 ]]; then
              exit "$launch_status"
            fi
            exit 1
          fi
          test "$logcat_status" -eq 0
          app_fatal_pattern='FATAL EXCEPTION|JavascriptException|Maximum call stack size exceeded|Unable to load script|Could not connect to development server|Unable to resolve host'
          if grep -Fq "Process: ${PACKAGE_ID}" "$RUNNER_TEMP/app-launch-logcat.txt"; then
            set +e
            grep -F -B 12 -A 24 "Process: ${PACKAGE_ID}" "$RUNNER_TEMP/app-launch-logcat.txt" \
              | grep -Eiq "$app_fatal_pattern"
            app_fatal_status=$?
            set -e
            if [[ "$app_fatal_status" -eq 0 ]]; then
              echo "Fatal logcat entry was detected for ${PACKAGE_ID}." >&2
              cat "$RUNNER_TEMP/app-launch-logcat.txt" >&2
              exit 1
            fi
          fi
          if grep -Eiq "ReactNativeJS.*($app_fatal_pattern)" "$RUNNER_TEMP/app-launch-logcat.txt"; then
            echo "Fatal React Native logcat entry was detected for ${PACKAGE_ID}." >&2
            cat "$RUNNER_TEMP/app-launch-logcat.txt" >&2
            exit 1
          fi
      - name: Capture Android Screen Catalog baseline
        id: android_visual_capture
        if: ${{ !cancelled() && inputs.capture_spec_visuals == true && steps.android_emulator_ready.outcome == 'success' && steps.android_profile_normalize.outcome == 'success' && steps.android_automation_install.outcome == 'success' && steps.maestro_cli.outcome == 'success' }}
        shell: bash
        env:
          CAPTURE_CASE_SELECTION: ${{ inputs.capture_case_key }}
        run: |
          set -euo pipefail
          BATCH_ROOT="$RUNNER_TEMP/spec-visuals"
          RAW_ROOT="$BATCH_ROOT/raw"
          BATCH_MANIFEST="$BATCH_ROOT/batch.manifest.json"
          CASE_LIST_JSON="$RUNNER_TEMP/android-capture-cases.json"
          mkdir -p "$RAW_ROOT"

          if [[ "$CAPTURE_CASE_SELECTION" == "all" ]]; then
            REQUESTED_MODE="all"
            pnpm exec tsx scripts/spec/android-visual-capture.ts list-cases > "$CASE_LIST_JSON"
          else
            REQUESTED_MODE="single"
            jq -n --arg capture_case_key "$CAPTURE_CASE_SELECTION" \
              '{platform: "android", count: 1, capture_case_keys: [$capture_case_key]}' \
              > "$CASE_LIST_JSON"
          fi

          mapfile -t CASE_KEYS < <(jq -r '.capture_case_keys[]' "$CASE_LIST_JSON")
          EXPECTED_CASE_COUNT="${#CASE_KEYS[@]}"
          test "$EXPECTED_CASE_COUNT" -gt 0
          CAPTURED_CASE_KEYS=()
          FAILED_CASE_KEY=""
          FAILURE_MESSAGE=""

          capture_case() (
            set -euo pipefail
            local CASE_KEY="$1"
            local CASE_INDEX="$2"
            local CASE_JSON="$RUNNER_TEMP/android-capture-case-${CASE_INDEX}.json"
            pnpm exec tsx scripts/spec/android-visual-capture.ts describe-case \
              --capture-case-key "$CASE_KEY" \
              > "$CASE_JSON"
            local SCREEN_ID STATE_SLUG SCENARIO ROUTE ROLE SETUP READY NATIVE_SETUP_ID
            local NATIVE_SETUP_SUBFLOW NATIVE_RESET_PAYMENT_DELAY_MS NATIVE_CHECKOUT_STEP
            local NATIVE_READY_ID CAPTURE_MODE CANONICAL_ASSET_PATH
            SCREEN_ID="$(jq -r '.screen_id' "$CASE_JSON")"
            STATE_SLUG="$(jq -r '.state_slug' "$CASE_JSON")"
            SCENARIO="$(jq -r '.scenario' "$CASE_JSON")"
            ROUTE="$(jq -r '.route' "$CASE_JSON")"
            ROLE="$(jq -r '.role' "$CASE_JSON")"
            SETUP="$(jq -r '.setup' "$CASE_JSON")"
            READY="$(jq -r '.ready' "$CASE_JSON")"
            NATIVE_SETUP_ID="$(jq -r '.native_setup_id' "$CASE_JSON")"
            NATIVE_SETUP_SUBFLOW="$(jq -r '.native_setup_subflow // ""' "$CASE_JSON")"
            NATIVE_RESET_PAYMENT_DELAY_MS="$(jq -r '.native_reset_payment_delay_ms' "$CASE_JSON")"
            NATIVE_CHECKOUT_STEP="$(jq -r '.native_checkout_step // ""' "$CASE_JSON")"
            NATIVE_READY_ID="$(jq -r '.native_ready_id' "$CASE_JSON")"
            CAPTURE_MODE="$(jq -r '.capture_mode' "$CASE_JSON")"
            CANONICAL_ASSET_PATH="$(jq -r '.canonical_asset_path' "$CASE_JSON")"
            for value in "$SCREEN_ID" "$STATE_SLUG" "$SCENARIO" "$ROUTE" "$ROLE" "$SETUP" "$READY" "$NATIVE_SETUP_ID" "$NATIVE_RESET_PAYMENT_DELAY_MS" "$NATIVE_READY_ID" "$CAPTURE_MODE" "$CANONICAL_ASSET_PATH"; do
              test -n "$value"
            done
            [[ "$NATIVE_RESET_PAYMENT_DELAY_MS" =~ ^[0-9]+$ ]]
            if [[ -n "$NATIVE_CHECKOUT_STEP" ]]; then
              case "$NATIVE_CHECKOUT_STEP" in
                address|payment|confirm) ;;
                *) echo "Unexpected native checkout step: $NATIVE_CHECKOUT_STEP" >&2; exit 1 ;;
              esac
            fi
            if [[ -n "$NATIVE_SETUP_SUBFLOW" ]]; then
              test -f "$GITHUB_WORKSPACE/maestro/$NATIVE_SETUP_SUBFLOW"
            fi
            echo "capture_case_key=$CASE_KEY"
            echo "screen_id=$SCREEN_ID"
            echo "state_slug=$STATE_SLUG"
            echo "scenario=$SCENARIO"
            echo "route=$ROUTE"
            echo "role=$ROLE"
            echo "setup=$SETUP"
            echo "ready=$READY"
            echo "native_setup_id=$NATIVE_SETUP_ID"
            echo "native_setup_subflow=$NATIVE_SETUP_SUBFLOW"
            echo "native_reset_payment_delay_ms=$NATIVE_RESET_PAYMENT_DELAY_MS"
            echo "native_checkout_step=$NATIVE_CHECKOUT_STEP"
            echo "native_ready_id=$NATIVE_READY_ID"
            echo "capture_mode=$CAPTURE_MODE"
            echo "canonical_asset_path=$CANONICAL_ASSET_PATH"
            local RAW_DIR="$RAW_ROOT/$SCREEN_ID/$STATE_SLUG"
            local RAW_PNG="$RAW_DIR/android.png"
            local MANIFEST="$RAW_DIR/android.manifest.json"
            mkdir -p "$RAW_DIR"
            local scenario_encoded reset_url route_without_leading_slash route_url route_is_root
            scenario_encoded="$(jq -rn --arg value "$SCENARIO" '$value | @uri')"
            reset_url="scenario-shop://test-control/reset?version=1&scenario=${scenario_encoded}&clock=2026-07-01T03%3A00%3A00.000Z&paymentDelayMs=${NATIVE_RESET_PAYMENT_DELAY_MS}"
            route_without_leading_slash="${ROUTE#/}"
            route_url="scenario-shop://${route_without_leading_slash}"
            route_is_root="false"
            if [[ "$ROUTE" == "/" ]]; then route_is_root="true"; fi
            local READY_COUNT
            READY_COUNT="$(jq '.ready_conditions | length' "$CASE_JSON")"
            test "$READY_COUNT" -ge 1
            test "$READY_COUNT" -le 3
            local case_artifact_dir="$RUNNER_TEMP/maestro-artifacts/visual-capture/$SCREEN_ID/$STATE_SLUG"
            local case_junit="$RUNNER_TEMP/maestro-visual-capture-${CASE_INDEX}.xml"
            local -a maestro_env_args
            maestro_env_args=(
              --env "RESET_URL=$reset_url"
              --env "ROUTE_URL=$route_url"
              --env "ROUTE_IS_ROOT=$route_is_root"
              --env "ROLE=$ROLE"
              --env "SETUP_ID=$NATIVE_SETUP_ID"
              --env "SETUP_SUBFLOW=$NATIVE_SETUP_SUBFLOW"
              --env "RESET_PAYMENT_DELAY_MS=$NATIVE_RESET_PAYMENT_DELAY_MS"
              --env "CHECKOUT_STEP=$NATIVE_CHECKOUT_STEP"
              --env "READY_ID=$NATIVE_READY_ID"
              --env "SCREEN_ID=$SCREEN_ID"
              --env "STATE_SLUG=$STATE_SLUG"
            )
            local slot index ready_kind ready_value
            for slot in 1 2 3; do
              index=$((slot - 1))
              ready_kind="$(jq -r ".ready_conditions[$index].kind // \"\"" "$CASE_JSON")"
              ready_value="$(jq -r ".ready_conditions[$index].value // \"\"" "$CASE_JSON")"
              maestro_env_args+=(--env "READY_KIND_${slot}=$ready_kind")
              maestro_env_args+=(--env "READY_VALUE_${slot}=$ready_value")
            done
            bash "$GITHUB_WORKSPACE/scripts/native/android-maestro-run.sh" \
              --flow "$GITHUB_WORKSPACE/maestro/native-visual-capture.yaml" \
              --test-output-dir "$case_artifact_dir" \
              --junit-output "$case_junit" \
              "${maestro_env_args[@]}"
            timeout 30 "$ADB" exec-out screencap -p > "$RAW_PNG"
            test -s "$RAW_PNG"
            pnpm exec tsx scripts/spec/android-visual-capture.ts write-manifest \
              --capture-case-key "$CASE_KEY" \
              --source-commit-sha "$GITHUB_SHA" \
              --automation-apk-path "$APK_PATH" \
              --raw-png-path "$RAW_PNG" \
              --output "$MANIFEST" \
              --observed-profile-json "$ANDROID_OBSERVED_PROFILE_JSON" \
              --system-image google_apis \
              --avd-profile pixel_2 \
              --workflow-run-id "$GITHUB_RUN_ID"
          )

          case_index=0
          for CASE_KEY in "${CASE_KEYS[@]}"; do
            case_index=$((case_index + 1))
            case_log="$RUNNER_TEMP/android-capture-case-${case_index}.log"
            set +e
            capture_case "$CASE_KEY" "$case_index" > "$case_log" 2>&1
            case_status=$?
            set -e
            cat "$case_log"
            if [[ "$case_status" -ne 0 ]]; then
              FAILED_CASE_KEY="$CASE_KEY"
              FAILURE_MESSAGE="capture failed with exit code $case_status"
              cp "$case_log" "$BATCH_ROOT/failed-case-${case_index}.log"
              break
            fi
            CAPTURED_CASE_KEYS+=("$CASE_KEY")
          done

          if [[ -z "$FAILED_CASE_KEY" && "${#CAPTURED_CASE_KEYS[@]}" -eq "$EXPECTED_CASE_COUNT" ]]; then
            COMPLETE=true
          else
            COMPLETE=false
          fi
          capture_case_keys_json="$(jq -c '.capture_case_keys' "$CASE_LIST_JSON")"
          if [[ "${#CAPTURED_CASE_KEYS[@]}" -eq 0 ]]; then
            captured_case_keys_json='[]'
          else
            captured_case_keys_json="$(printf '%s\n' "${CAPTURED_CASE_KEYS[@]}" | jq -R . | jq -s -c '.')"
          fi
          jq -n \
            --argjson schema_version 1 \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg source_commit_sha "$GITHUB_SHA" \
            --arg requested_mode "$REQUESTED_MODE" \
            --argjson expected_case_count "$EXPECTED_CASE_COUNT" \
            --argjson capture_case_keys "$capture_case_keys_json" \
            --argjson captured_case_count "${#CAPTURED_CASE_KEYS[@]}" \
            --argjson captured_case_keys "$captured_case_keys_json" \
            --argjson complete "$COMPLETE" \
            --arg failed_case_key "$FAILED_CASE_KEY" \
            --arg failure_message "$FAILURE_MESSAGE" \
            '{schema_version: $schema_version, workflow_run_id: $workflow_run_id, source_commit_sha: $source_commit_sha, requested_mode: $requested_mode, expected_case_count: $expected_case_count, capture_case_keys: $capture_case_keys, captured_case_count: $captured_case_count, captured_case_keys: $captured_case_keys, complete: $complete} + (if $failed_case_key == "" then {} else {failed_case_key: $failed_case_key, failure_message: $failure_message} end)' \
            > "$BATCH_MANIFEST"
          cat "$BATCH_MANIFEST"
          if [[ "$COMPLETE" != true ]]; then
            echo "Android visual batch is incomplete; canonical promotion is forbidden." >&2
            exit 1
          fi
      - name: Upload Android Screen Catalog raw visuals
