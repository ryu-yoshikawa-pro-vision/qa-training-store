name: Native CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PNPM_VERSION: 9.10.0
  EXPO_DOCTOR_VERSION: 1.17.6
  MAESTRO_VERSION: 1.39.15

jobs:
  detect:
    name: Detect Native Changes
    runs-on: ubuntu-24.04
    outputs:
      native_changed: ${{ steps.paths.outputs.native_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        name: Check Native paths
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- \
            'app/**/*.native.tsx' \
            'src/application/**' \
            'src/domain/**' \
            'src/seeds/**' \
            'src/config/**' \
            'src/presentation/design/**' \
            'src/generated/**' \
            'config/**' \
            'public/images/product-image-manifest.json' \
            'scripts/generate-native-asset-map.ts' \
            'scripts/validate-native-production-bundle.ts' \
            'src/**/*.native.ts' \
            'src/**/*.native.tsx' \
            'src/bootstrap/native-runtime.ts' \
            'src/infrastructure/database/sqlite/**' \
            'src/infrastructure/session/native-stores.ts' \
            'src/infrastructure/security/password-hasher.native.ts' \
            'src/test-controls/**' \
            'src/presentation/native/**' \
            'app.config.ts' \
            'metro.config.*' \
            'package.json' \
            'pnpm-lock.yaml' \
            'maestro/**' \
            '.github/workflows/native-ci.yml' \
            '.github/workflows/native-ios-ci.yml'; then
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
          fi

  static:
    name: Native Static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate:native-assets
      - run: git diff --exit-code -- src/generated/native-product-assets.ts
      - run: pnpm run validate:image-manifest
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:component:native
      - run: pnpm run test:repository
      - run: pnpm run test:contracts
      - run: pnpm run check:native-route-dependencies
      - run: pnpm run validate:eas:config
      - run: pnpm dlx expo-doctor@${{ env.EXPO_DOCTOR_VERSION }}

  production-bundle-guard:
    name: Production Bundle Guard
    needs: [detect, static]
    if: needs.static.result == 'success' && (needs.detect.outputs.native_changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:native-production-bundle

  android:
    name: Android Build / Emulator / Maestro
    needs: [detect, static]
    if: needs.static.result == 'success' && (needs.detect.outputs.native_changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXPO_PUBLIC_APP_ENV: automation
      EXPO_PUBLIC_BUILD_KIND: automation
      EXPO_PUBLIC_TEST_MODE: "true"
      EXPO_PUBLIC_DEFAULT_SEED: default
      ANDROID_API_LEVEL: "34"
      ANDROID_COMPILE_API_LEVEL: "36"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android emulator runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libpulse0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate:native-assets
      - run: git diff --exit-code -- src/generated/native-product-assets.ts
      - run: pnpm exec expo prebuild --clean --platform android --no-install
      - name: Resolve Android SDK and sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          AVDMANAGER="$(dirname "$SDKMANAGER")/avdmanager"
          APK_PATH="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ADB=$ADB" >> "$GITHUB_ENV"
          echo "EMULATOR=$EMULATOR" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$(dirname "$SDKMANAGER"):$PATH"
          echo "Resolved Android SDK: $SDK_ROOT"
          echo "Resolved sdkmanager: $SDKMANAGER"
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_API_LEVEL}" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-${ANDROID_API_LEVEL};google_apis;x86_64"
      - name: Verify Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          echo "ADB=$ADB"
          echo "EMULATOR=$EMULATOR"
          echo "AVDMANAGER=$AVDMANAGER"
          test -d "$ANDROID_HOME"
          test -x "$SDKMANAGER"
          test -x "$ADB"
          test -x "$EMULATOR"
          test -x "$AVDMANAGER"
          ls -la "$ANDROID_HOME/platform-tools"
          ls -la "$ANDROID_HOME/emulator"
          ls -la "$(dirname "$SDKMANAGER")"
      - name: Verify adb
        shell: bash
        run: |
          set -euo pipefail
          "$ADB" version
      - name: Verify avdmanager
        shell: bash
        run: |
          set -euo pipefail
          "$AVDMANAGER" list target
      - name: Inspect emulator binary
        shell: bash
        run: |
          set -u -o pipefail
          version_log="$RUNNER_TEMP/emulator-version.txt"
          set +e
          timeout 15 "$EMULATOR" -version > "$version_log" 2>&1
          version_status=$?
          set -e
          cat "$version_log"
          echo "emulator -version exit code: $version_status"
          if [[ "$version_status" -ne 0 ]]; then
            echo "emulator -version is diagnostic; the Emulator start step is authoritative."
          fi
      - name: Build Automation Release APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace \
            2>&1 | tee "$RUNNER_TEMP/gradle-assemble-release.log"
      - name: Verify Automation Release APK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$APK_PATH"
          test -s "$APK_PATH"
          if ! unzip -l "$APK_PATH" | grep -Eq 'assets/.*\.(bundle|hbc)'; then
            echo "Automation Release APK does not contain a JavaScript bundle." >&2
            unzip -l "$APK_PATH" | tail -n 40 >&2
            exit 1
          fi
          ls -lh "$APK_PATH"
      - name: Start Android Emulator with KVM
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          export ANDROID_AVD_HOME
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          echo "ANDROID_PREFS_ROOT=${ANDROID_PREFS_ROOT:-<unset>}"
          echo "HOME=${HOME:-<unset>}"

          fail_emulator() {
            echo "$1" >&2
            echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME:-<unset>}" >&2
            echo "ANDROID_PREFS_ROOT=${ANDROID_PREFS_ROOT:-<unset>}" >&2
            echo "HOME=${HOME:-<unset>}" >&2
            echo "emulator -list-avds:" >&2
            if [[ -f "$RUNNER_TEMP/avd-list.txt" ]]; then
              cat "$RUNNER_TEMP/avd-list.txt" >&2
            else
              echo "<not captured>" >&2
            fi
            echo "AVD files:" >&2
            if [[ -d "${ANDROID_AVD_HOME:-}" ]]; then
              find "$ANDROID_AVD_HOME" -maxdepth 3 -print >&2
            else
              echo "<missing>" >&2
            fi
            if [[ -f "$RUNNER_TEMP/emulator.log" ]]; then
              echo "emulator.log (tail):" >&2
              tail -n 200 "$RUNNER_TEMP/emulator.log" >&2
            fi
            exit 1
          }

          if [[ -e /dev/kvm ]]; then
            ls -l /dev/kvm
          else
            fail_emulator "/dev/kvm is not available."
          fi
          sudo chmod 666 /dev/kvm
          if ! printf 'no\n' | timeout 120 "$AVDMANAGER" create avd \
            -n native-api34 \
            -k "system-images;android-${ANDROID_API_LEVEL};google_apis;x86_64" \
            -p "$ANDROID_AVD_HOME/native-api34.avd" \
            --device "pixel_2" \
            --force; then
            fail_emulator "Android AVD creation failed."
          fi
          find "$ANDROID_AVD_HOME" -maxdepth 3 -type f -print \
            | tee "$RUNNER_TEMP/avd-files.txt"
          if [[ ! -f "$ANDROID_AVD_HOME/native-api34.ini" || ! -d "$ANDROID_AVD_HOME/native-api34.avd" ]]; then
            fail_emulator "AVD files were not created in ANDROID_AVD_HOME."
          fi
          set +e
          "$EMULATOR" -list-avds | tee "$RUNNER_TEMP/avd-list.txt"
          avd_list_status=${PIPESTATUS[0]}
          set -e
          if [[ "$avd_list_status" -ne 0 ]] || ! grep -Fxq "native-api34" "$RUNNER_TEMP/avd-list.txt"; then
            fail_emulator "Android Emulator did not recognize native-api34."
          fi
          "$EMULATOR" \
            -avd native-api34 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            >"$RUNNER_TEMP/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          echo "EMULATOR_PID=$EMULATOR_PID" | tee "$RUNNER_TEMP/emulator-pid.txt"
          echo "EMULATOR_PID=$EMULATOR_PID" >> "$GITHUB_ENV"

          adb_ready=false
          for _ in $(seq 1 90); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              fail_emulator "Android Emulator terminated before ADB became available."
            fi
            if "$ADB" get-state >/dev/null 2>&1; then
              adb_ready=true
              break
            fi
            sleep 2
          done
          if [[ "$adb_ready" != true ]]; then
            fail_emulator "Android Emulator did not become available through ADB."
          fi
          "$ADB" get-state
          "$ADB" devices -l

          boot_completed=false
          for _ in $(seq 1 150); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              fail_emulator "Android Emulator terminated before Android boot completed."
            fi
            boot_state=""
            if boot_state=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r"); then
              if [[ "$boot_state" == "1" ]]; then
                boot_completed=true
                break
              fi
            fi
            sleep 2
          done
          if [[ "$boot_completed" != true ]]; then
            fail_emulator "Android Emulator did not report sys.boot_completed=1."
          fi
          "$ADB" shell getprop sys.boot_completed
          "$ADB" shell getprop ro.build.version.sdk
          "$ADB" shell getprop ro.product.cpu.abi

          package_service_ready=false
          for _ in $(seq 1 90); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              fail_emulator "Android Emulator terminated before the package service became available."
            fi
            if "$ADB" shell service check package 2>/dev/null | grep -q "found"; then
              package_service_ready=true
              break
            fi
            sleep 2
          done
          if [[ "$package_service_ready" != true ]]; then
            fail_emulator "Android package service did not become available."
          fi
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          "$ADB" shell input keyevent 82
      - name: Install and launch APK
        shell: bash
        run: |
          set -euo pipefail
          "$ADB" logcat -c
          "$ADB" install -r "$APK_PATH"
          "$ADB" shell pm path com.ryuyoshikawa.scenarioshop | grep -F 'package:'
          "$ADB" shell monkey \
            -p com.ryuyoshikawa.scenarioshop \
            -c android.intent.category.LAUNCHER \
            1
          timeout 60 bash -c 'until "$ADB" shell pidof com.ryuyoshikawa.scenarioshop 2>/dev/null | grep -q .; do sleep 2; done'
          "$ADB" logcat -d > "$RUNNER_TEMP/app-launch-logcat.txt"
          if grep -Eiq 'unable to resolve host|could not connect to development server|unable to load script' "$RUNNER_TEMP/app-launch-logcat.txt"; then
            cat "$RUNNER_TEMP/app-launch-logcat.txt" >&2
            exit 1
          fi
      - name: Install pinned Maestro CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/maestro"
          curl --fail --location --retry 3 "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" --output "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Reset Test Control by Deep Link
        shell: bash
        run: |
          "$ADB" shell am start \
            -W \
            -a android.intent.action.VIEW \
            -d 'scenario-shop://test-control/reset?version=1&scenario=default&clock=2026-07-01T03%3A00%3A00.000Z&paymentDelayMs=0' \
            com.ryuyoshikawa.scenarioshop
      - name: Run Test Control and Contract Harness flows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maestro-artifacts"
          maestro test "$GITHUB_WORKSPACE/maestro/native-test-control.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/test-control" \
            --format junit --output "$RUNNER_TEMP/maestro-test-control.xml"
          maestro test "$GITHUB_WORKSPACE/maestro/native-contract-harness.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/contract-harness" \
            --format junit --output "$RUNNER_TEMP/maestro-contract-harness.xml"
          maestro test "$GITHUB_WORKSPACE/maestro/native-not-found.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/not-found" \
            --format junit --output "$RUNNER_TEMP/maestro-not-found.xml"
      - name: Run Native Storefront and Cart flows
        shell: bash
        run: |
          set -euo pipefail
          maestro test "$GITHUB_WORKSPACE/maestro/native-storefront.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/storefront" \
            --format junit --output "$RUNNER_TEMP/maestro-storefront.xml"
          maestro test "$GITHUB_WORKSPACE/maestro/native-cart.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/cart" \
            --format junit --output "$RUNNER_TEMP/maestro-cart.xml"
          maestro test "$GITHUB_WORKSPACE/maestro/native-restart-persistence.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/restart-persistence" \
            --format junit --output "$RUNNER_TEMP/maestro-restart-persistence.xml"
          maestro test "$GITHUB_WORKSPACE/maestro/native-reset-dirty-state.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/reset-dirty-state" \
            --format junit --output "$RUNNER_TEMP/maestro-reset-dirty-state.xml"
          maestro test "$GITHUB_WORKSPACE/maestro/native-out-of-stock.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/out-of-stock" \
            --format junit --output "$RUNNER_TEMP/maestro-out-of-stock.xml"
          maestro test "$GITHUB_WORKSPACE/maestro/native-low-stock.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/low-stock" \
            --format junit --output "$RUNNER_TEMP/maestro-low-stock.xml"
          maestro test "$GITHUB_WORKSPACE/maestro/native-purchase-limit.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/purchase-limit" \
            --format junit --output "$RUNNER_TEMP/maestro-purchase-limit.xml"
      - name: Collect Android evidence
        if: always()
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-evidence"

          capture_command() {
            local output="$1"
            shift
            set +e
            timeout 15 "$@" > "$output" 2>&1
            local status=$?
            set -e
            if [[ "$status" -ne 0 ]]; then
              echo "command exit code: $status" >> "$output"
            fi
          }

          {
            echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME:-<unset>}"
            echo "ANDROID_PREFS_ROOT=${ANDROID_PREFS_ROOT:-<unset>}"
            echo "HOME=${HOME:-<unset>}"
          } > "$RUNNER_TEMP/native-evidence/android-environment.txt"

          if [[ -n "${ANDROID_AVD_HOME:-}" && -d "$ANDROID_AVD_HOME" ]]; then
            find "$ANDROID_AVD_HOME" -maxdepth 3 -print \
              > "$RUNNER_TEMP/native-evidence/avd-files.txt"
          else
            echo "AVD directory was not created." \
              > "$RUNNER_TEMP/native-evidence/avd-files.txt"
          fi
          if [[ -f "$RUNNER_TEMP/avd-list.txt" ]]; then
            cp "$RUNNER_TEMP/avd-list.txt" "$RUNNER_TEMP/native-evidence/avd-list.txt"
          else
            echo "emulator -list-avds was not completed." \
              > "$RUNNER_TEMP/native-evidence/avd-list.txt"
          fi
          if [[ -f "$RUNNER_TEMP/emulator-pid.txt" ]]; then
            cp "$RUNNER_TEMP/emulator-pid.txt" "$RUNNER_TEMP/native-evidence/emulator-pid.txt"
          fi

          if [[ -n "${ADB:-}" && -x "${ADB:-}" ]]; then
            if timeout 5 "$ADB" get-state >/dev/null 2>&1; then
              capture_command "$RUNNER_TEMP/native-evidence/adb-get-state.txt" "$ADB" get-state
              capture_command "$RUNNER_TEMP/native-evidence/adb-devices.txt" "$ADB" devices -l
              capture_command "$RUNNER_TEMP/native-evidence/sys-boot-completed.txt" "$ADB" shell getprop sys.boot_completed
              capture_command "$RUNNER_TEMP/native-evidence/android-build-properties.txt" "$ADB" shell getprop ro.build.version.sdk
              capture_command "$RUNNER_TEMP/native-evidence/android-abi.txt" "$ADB" shell getprop ro.product.cpu.abi
              capture_command "$RUNNER_TEMP/native-evidence/package-path.txt" "$ADB" shell pm path com.ryuyoshikawa.scenarioshop
              capture_command "$RUNNER_TEMP/native-evidence/package-process.txt" "$ADB" shell pidof com.ryuyoshikawa.scenarioshop
              capture_command "$RUNNER_TEMP/native-evidence/dumpsys-package.txt" "$ADB" shell dumpsys package com.ryuyoshikawa.scenarioshop
              capture_command "$RUNNER_TEMP/native-evidence/dumpsys-activity.txt" "$ADB" shell dumpsys activity activities
              capture_command "$RUNNER_TEMP/native-evidence/adb-logcat.txt" "$ADB" logcat -d
            else
              echo "Android device was not started or was unavailable." \
                > "$RUNNER_TEMP/native-evidence/adb-get-state.txt"
              echo "Android device was not started or was unavailable." \
                > "$RUNNER_TEMP/native-evidence/adb-devices.txt"
              echo "Android device was not started or was unavailable." \
                > "$RUNNER_TEMP/native-evidence/adb-logcat.txt"
            fi
          else
            echo "Android adb executable was not resolved." \
              > "$RUNNER_TEMP/native-evidence/adb-get-state.txt"
            echo "Android adb executable was not resolved." \
              > "$RUNNER_TEMP/native-evidence/adb-devices.txt"
            echo "Android adb executable was not resolved." \
              > "$RUNNER_TEMP/native-evidence/adb-logcat.txt"
          fi
          if [[ -f "$RUNNER_TEMP/emulator.log" ]]; then
            cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/native-evidence/emulator.log"
          else
            echo "Emulator was not started." \
              > "$RUNNER_TEMP/native-evidence/emulator.log"
          fi
          if [[ -n "${APK_PATH:-}" && -f "$APK_PATH" ]]; then
            cp "$APK_PATH" "$RUNNER_TEMP/native-evidence/app-release.apk"
            capture_command "$RUNNER_TEMP/native-evidence/apk-info.txt" bash -c \
              'ls -lh "$1"; file "$1"; unzip -l "$1" | grep -E "AndroidManifest.xml|assets/.*\\.(bundle|hbc)"' \
              bash "$APK_PATH"
          else
            echo "Automation Release APK was not generated." \
              > "$RUNNER_TEMP/native-evidence/apk-status.txt"
          fi
          if [[ -f "$RUNNER_TEMP/gradle-assemble-release.log" ]]; then
            cp "$RUNNER_TEMP/gradle-assemble-release.log" \
              "$RUNNER_TEMP/native-evidence/gradle-assemble-release.log"
          else
            echo "Gradle Release build log was not generated." \
              > "$RUNNER_TEMP/native-evidence/gradle-status.txt"
          fi
          if [[ -f "$RUNNER_TEMP/emulator-version.txt" ]]; then
            cp "$RUNNER_TEMP/emulator-version.txt" \
              "$RUNNER_TEMP/native-evidence/emulator-version.txt"
          fi
          if [[ -f "$RUNNER_TEMP/app-launch-logcat.txt" ]]; then
            cp "$RUNNER_TEMP/app-launch-logcat.txt" \
              "$RUNNER_TEMP/native-evidence/app-launch-logcat.txt"
          fi
          shopt -s nullglob
          for junit_path in "$RUNNER_TEMP"/maestro-*.xml; do
            cp "$junit_path" "$RUNNER_TEMP/native-evidence/"
          done
          if [[ -d "$RUNNER_TEMP/maestro-artifacts" ]]; then
            mkdir -p "$RUNNER_TEMP/native-evidence/maestro-artifacts"
            cp -R "$RUNNER_TEMP/maestro-artifacts/." \
              "$RUNNER_TEMP/native-evidence/maestro-artifacts/"
            set +e
            grep -R -h -E 'native-(test-runtime-ready|contract-(running|passed|failed))' \
              "$RUNNER_TEMP/maestro-artifacts" \
              > "$RUNNER_TEMP/native-evidence/test-control-contract-signals.txt"
            signal_status=$?
            set -e
            if [[ "$signal_status" -ne 0 ]]; then
              echo "No Test Control or Contract Harness signal text was captured." \
                > "$RUNNER_TEMP/native-evidence/test-control-contract-signals.txt"
            fi
          else
            echo "Maestro artifact directory was not created." \
              > "$RUNNER_TEMP/native-evidence/test-control-contract-signals.txt"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/native-evidence
          retention-days: 7

  verify:
    name: native-ci / verify
    needs: [detect, static, production-bundle-guard, android]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require stable Native CI result
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          NATIVE_CHANGED: ${{ needs.detect.outputs.native_changed }}
          STATIC_RESULT: ${{ needs.static.result }}
          PRODUCTION_RESULT: ${{ needs.production-bundle-guard.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          test "$DETECT_RESULT" = success
          test -n "$NATIVE_CHANGED"
          case "$NATIVE_CHANGED" in
            true|false) ;;
            *) echo "Unexpected native_changed output: $NATIVE_CHANGED" >&2; exit 1 ;;
          esac
          test "$STATIC_RESULT" = success
          if [[ "$NATIVE_CHANGED" == "true" ]]; then
            test "$PRODUCTION_RESULT" = success
            test "$ANDROID_RESULT" = success
          else
            test "$PRODUCTION_RESULT" = success || test "$PRODUCTION_RESULT" = skipped
            test "$ANDROID_RESULT" = success || test "$ANDROID_RESULT" = skipped
          fi
