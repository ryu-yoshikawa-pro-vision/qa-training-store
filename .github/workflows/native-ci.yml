name: Native CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PNPM_VERSION: 9.10.0
  EXPO_DOCTOR_VERSION: 1.17.6
  MAESTRO_VERSION: 1.39.15

jobs:
  detect:
    name: Detect Native Changes
    runs-on: ubuntu-24.04
    outputs:
      native_changed: ${{ steps.paths.outputs.native_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        name: Check Native paths
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- \
            'app/**/*.native.tsx' \
            'src/**/*.native.ts' \
            'src/**/*.native.tsx' \
            'src/bootstrap/native-runtime.ts' \
            'src/infrastructure/database/sqlite/**' \
            'src/infrastructure/session/native-stores.ts' \
            'src/infrastructure/security/password-hasher.native.ts' \
            'src/test-controls/native-*' \
            'src/presentation/native/**' \
            'app.config.ts' \
            'metro.config.*' \
            'package.json' \
            'pnpm-lock.yaml' \
            'maestro/**' \
            '.github/workflows/native-ci.yml' \
            '.github/workflows/native-ios-ci.yml'; then
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
          fi

  static:
    name: Native Static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate:native-assets
      - run: git diff --exit-code -- src/generated/native-product-assets.ts
      - run: pnpm run validate:image-manifest
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:component:native
      - run: pnpm run test:repository
      - run: pnpm run test:contracts
      - run: pnpm run check:native-route-dependencies
      - run: pnpm run validate:eas:config
      - run: pnpm dlx expo-doctor@${{ env.EXPO_DOCTOR_VERSION }}

  production-bundle-guard:
    name: Production Bundle Guard
    needs: [detect, static]
    if: needs.static.result == 'success' && (needs.detect.outputs.native_changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:native-production-bundle

  android:
    name: Android Build / Emulator / Maestro
    needs: [detect, static]
    if: needs.static.result == 'success' && (needs.detect.outputs.native_changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPO_PUBLIC_APP_ENV: automation
      EXPO_PUBLIC_BUILD_KIND: automation
      EXPO_PUBLIC_TEST_MODE: "true"
      EXPO_PUBLIC_DEFAULT_SEED: default
      ANDROID_API_LEVEL: "34"
      ANDROID_COMPILE_API_LEVEL: "36"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate:native-assets
      - run: git diff --exit-code -- src/generated/native-product-assets.ts
      - run: pnpm exec expo prebuild --clean --platform android --no-install
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_COMPILE_API_LEVEL}" "build-tools;36.0.0" "emulator" "system-images;android-${ANDROID_API_LEVEL};google_apis;x86_64"
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Start Android Emulator with KVM
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd -n native-api34 -k "system-images;android-${ANDROID_API_LEVEL};google_apis;x86_64" --force
          emulator -avd native-api34 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect >"$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
      - name: Install and launch APK
        shell: bash
        run: |
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.ryuyoshikawa.scenarioshop
      - name: Install pinned Maestro CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/maestro"
          curl --fail --location --retry 3 "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" --output "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Reset Test Control by Deep Link
        shell: bash
        run: adb shell am start -a android.intent.action.VIEW -d 'scenario-shop://test-control/reset?version=1&scenario=default&clock=2026-07-01T03%3A00%3A00.000Z&paymentDelayMs=0' com.ryuyoshikawa.scenarioshop
      - name: Run Test Control and Contract Harness flows
        shell: bash
        run: |
          maestro test maestro/native-test-control.yaml --format junit --output "$RUNNER_TEMP/maestro-test-control.xml"
          maestro test maestro/native-contract-harness.yaml --format junit --output "$RUNNER_TEMP/maestro-contract-harness.xml"
          maestro test maestro/native-not-found.yaml --format junit --output "$RUNNER_TEMP/maestro-not-found.xml"
      - name: Run Native Storefront and Cart flows
        shell: bash
        run: |
          maestro test maestro/native-storefront.yaml --format junit --output "$RUNNER_TEMP/maestro-storefront.xml"
          maestro test maestro/native-cart.yaml --format junit --output "$RUNNER_TEMP/maestro-cart.xml"
      - name: Collect Android evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-evidence"
          adb logcat -d > "$RUNNER_TEMP/native-evidence/adb-logcat.txt" || true
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/native-evidence/app-debug.apk" || true
          cp "$RUNNER_TEMP/maestro-test-control.xml" "$RUNNER_TEMP/native-evidence/maestro-test-control.xml" || true
          cp "$RUNNER_TEMP/maestro-contract-harness.xml" "$RUNNER_TEMP/native-evidence/maestro-contract-harness.xml" || true
          cp "$RUNNER_TEMP/maestro-not-found.xml" "$RUNNER_TEMP/native-evidence/maestro-not-found.xml" || true
          cp "$RUNNER_TEMP/maestro-storefront.xml" "$RUNNER_TEMP/native-evidence/maestro-storefront.xml" || true
          cp "$RUNNER_TEMP/maestro-cart.xml" "$RUNNER_TEMP/native-evidence/maestro-cart.xml" || true
          cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/native-evidence/emulator.log" || true
          find . -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -not -path './node_modules/*' -exec cp --parents {} "$RUNNER_TEMP/native-evidence/" \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/native-evidence
          retention-days: 7

  verify:
    name: native-ci / verify
    needs: [detect, static, production-bundle-guard, android]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require stable Native CI result
        shell: bash
        env:
          NATIVE_CHANGED: ${{ needs.detect.outputs.native_changed }}
          STATIC_RESULT: ${{ needs.static.result }}
          PRODUCTION_RESULT: ${{ needs.production-bundle-guard.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          test "$STATIC_RESULT" = success
          if [[ "$NATIVE_CHANGED" == "true" ]]; then
            test "$PRODUCTION_RESULT" = success
            test "$ANDROID_RESULT" = success
          else
            test "$PRODUCTION_RESULT" = success || test "$PRODUCTION_RESULT" = skipped
            test "$ANDROID_RESULT" = success || test "$ANDROID_RESULT" = skipped
          fi
