name: Mobile App CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      capture_spec_visuals:
        description: Capture canonical Screen Catalog Android visuals
        required: false
        type: boolean
        default: false
      capture_case_key:
        description: Registry Android Capture Case key, or all for every Android target
        required: false
        type: string
        default: SCREEN-STOREFRONT-HOME/default/android

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.34.5
  HUSKY: "0"
  EXPO_DOCTOR_VERSION: 1.17.6
  MAESTRO_VERSION: 2.8.0
  MAESTRO_DOWNLOAD_URL: https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.8.0/maestro.zip
  MAESTRO_CACHE_SCHEMA: v1

jobs:
  detect:
    name: Detect Native Changes
    runs-on: ubuntu-24.04
    outputs:
      native_changed: ${{ steps.paths.outputs.native_changed }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        name: Check Native paths
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- \
            'app/**/*.native.tsx' \
            'src/application/**' \
            'src/domain/**' \
            'src/seeds/**' \
            'src/config/**' \
            'src/presentation/design/**' \
            'src/generated/**' \
            'config/**' \
            'public/images/product-image-manifest.json' \
            'public/images/products/**' \
            'public/images/placeholder.svg' \
            'android/app/build.gradle' \
            'android/app/proguard-rules.pro' \
            'android/app/src/**' \
            'android/build.gradle' \
            'android/settings.gradle' \
            'android/gradle.properties' \
            'android/gradle/wrapper/**' \
            'android/gradlew' \
            'eas.json' \
            '.eas/workflows/**' \
            'scripts/generate-native-asset-map.ts' \
            'scripts/validate-image-manifest.ts' \
            'scripts/validate-eas-static-config.ts' \
            'scripts/native/android-ci-production-bundle-guard.sh' \
            'scripts/native/android-ci-emulator-start.sh' \
            'scripts/native/android-ci-runtime-evidence.sh' \
            'scripts/native/android-maestro-run.sh' \
            'scripts/check-native-route-dependencies.ts' \
            'scripts/validate-native-production-bundle.ts' \
            'src/**/*.native.ts' \
            'src/**/*.native.tsx' \
            'src/bootstrap/native-runtime.ts' \
            'src/infrastructure/database/sqlite/**' \
            'src/infrastructure/normalization/normalizers.ts' \
            'src/infrastructure/address-lookup/static-address-lookup.ts' \
            'src/infrastructure/payment/mock-payment-gateway.ts' \
            'src/infrastructure/session/native-stores.ts' \
            'src/infrastructure/security/password-hasher.native.ts' \
            'src/test-controls/**' \
            'tests/component/native/**' \
            'tests/contracts/native-*.test.ts' \
            'tests/contracts/native-ci-workflow.test.ts' \
            'src/presentation/native/**' \
            'src/presentation/return-to.ts' \
            'app.config.ts' \
            'metro.config.*' \
            'package.json' \
            'pnpm-lock.yaml' \
            'maestro/**' \
            'training/maestro/**' \
            '.github/workflows/native-ci.yml' \
            '.github/workflows/native-android-build.yml' \
            '.github/workflows/native-ios-ci.yml'; then
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
          fi

  native-static:
    name: Native Static
    needs: detect
    if: needs.detect.outputs.native_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Native assets
        run: pnpm run generate:native-assets
      - name: Verify generated Native assets
        run: git diff --exit-code -- src/generated/native-product-assets.ts
      - name: Validate image manifest
        run: pnpm run validate:image-manifest
      - name: Run Native component tests
        run: pnpm run test:component:native
      - name: Check Native route dependencies
        run: pnpm run check:native-route-dependencies
      - name: Validate EAS config
        run: pnpm run validate:eas:config
      - name: Run Expo Doctor
        run: pnpm dlx expo-doctor@${{ env.EXPO_DOCTOR_VERSION }}

  android-automation-build:
    name: Android Automation Build
    needs: detect
    if: needs.detect.outputs.native_changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/native-android-build.yml
    with:
      build_kind: automation

  android-production-build:
    name: Android Production-validation Build
    needs: detect
    if: needs.detect.outputs.native_changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/native-android-build.yml
    with:
      build_kind: production

  production-bundle-guard:
    name: Production Bundle Guard
    needs: [detect, android-automation-build, android-production-build]
    if: >-
      always() &&
      (needs.detect.outputs.native_changed == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.android-automation-build.result == 'success' &&
      needs.android-production-build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Automation Release APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-android-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/native-bundle-guard/automation
      - name: Download Production-validation Release APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-android-production-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/native-bundle-guard/production
      - name: Inspect Actual Hermes artifacts with shared validator
        shell: bash
        env:
          AUTOMATION_APK_PATH: ${{ runner.temp }}/native-bundle-guard/automation/native-automation.apk
          PRODUCTION_APK_PATH: ${{ runner.temp }}/native-bundle-guard/production/native-production-validation.apk
        run: bash scripts/native/android-ci-production-bundle-guard.sh
  android-runtime:
    name: Android Runtime / Maestro
    needs: [detect, android-automation-build, android-production-build, production-bundle-guard]
    if: >-
      always() &&
      (needs.detect.outputs.native_changed == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.android-automation-build.result == 'success' || needs.android-production-build.result == 'success') &&
      (needs.production-bundle-guard.result == 'success' || needs.production-bundle-guard.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ANDROID_API_LEVEL: "34"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        if: ${{ inputs.capture_spec_visuals == true }}
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install visual capture dependencies
        if: ${{ inputs.capture_spec_visuals == true }}
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android emulator runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          if dpkg-query -W -f='${Status}' libpulse0 2>/dev/null | grep -q 'install ok installed'; then
            echo "libpulse0 is already installed; skipping apt-get update."
          else
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends libpulse0
          fi
      - name: Resolve Android SDK and sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          AVDMANAGER="$(dirname "$SDKMANAGER")/avdmanager"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ADB=$ADB" >> "$GITHUB_ENV"
          echo "EMULATOR=$EMULATOR" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$(dirname "$SDKMANAGER"):$PATH"
          echo "Resolved Android SDK: $SDK_ROOT"
          echo "Resolved sdkmanager: $SDKMANAGER"
      - name: Install Android SDK emulator components
        shell: bash
        run: |
          set -euo pipefail
          test -x "$SDKMANAGER"
          missing_components=()
          if [[ ! -x "$SDK_ROOT/platform-tools/adb" ]]; then
            missing_components+=("platform-tools")
          fi
          if [[ ! -x "$SDK_ROOT/emulator/emulator" ]]; then
            missing_components+=("emulator")
          fi
          if [[ ! -f "$SDK_ROOT/system-images/android-${ANDROID_API_LEVEL}/google_apis/x86_64/system.img" ]]; then
            missing_components+=("system-images;android-${ANDROID_API_LEVEL};google_apis;x86_64")
          fi
          if ((${#missing_components[@]} == 0)); then
            echo "All required Android SDK emulator components are already installed; skipping download."
            exit 0
          fi
          printf 'Missing Android SDK emulator components:\n - %s\n' "${missing_components[@]}"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$SDKMANAGER" "${missing_components[@]}"
      - name: List installed Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --list_installed
      - name: Verify Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          echo "ADB=$ADB"
          echo "EMULATOR=$EMULATOR"
          echo "AVDMANAGER=$AVDMANAGER"
          test -d "$SDK_ROOT"
          test -d "$ANDROID_HOME"
          test -x "$SDKMANAGER"
          test -x "$ADB"
          test -x "$EMULATOR"
          test -x "$AVDMANAGER"
          ls -la "$ANDROID_HOME/platform-tools"
          ls -la "$ANDROID_HOME/emulator"
          ls -la "$(dirname "$SDKMANAGER")"
      - name: Verify adb
        shell: bash
        run: |
          set -euo pipefail
          "$ADB" version
      - name: Verify avdmanager
        shell: bash
        run: |
          set -euo pipefail
          "$AVDMANAGER" list target
      - name: Inspect emulator binary
        shell: bash
        run: |
          set -u -o pipefail
          version_log="$RUNNER_TEMP/emulator-version.txt"
          set +e
          timeout 15 "$EMULATOR" -version > "$version_log" 2>&1
          version_status=$?
          set -e
          cat "$version_log"
          echo "emulator -version exit code: $version_status"
          if [[ "$version_status" -ne 0 ]]; then
            echo "emulator -version is diagnostic; the Emulator start step is authoritative."
          fi
      - name: Start Android Emulator with KVM
        id: android_emulator_ready
        shell: bash
        run: bash scripts/native/android-ci-emulator-start.sh
      - name: Stabilize Android launcher before APK launch
        if: ${{ !cancelled() && steps.android_emulator_ready.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          LAUNCHER_PACKAGE="com.google.android.apps.nexuslauncher"
          launcher_package_list="$RUNNER_TEMP/android-launcher-packages.txt"
          launcher_package_list_normalized="$RUNNER_TEMP/android-launcher-packages-normalized.txt"
          if ! timeout 30 "$ADB" shell pm list packages > "$launcher_package_list"; then
            echo "Unable to capture the Android package list for launcher stabilization." >&2
            exit 1
          fi
          if ! tr -d '\r' < "$launcher_package_list" > "$launcher_package_list_normalized"; then
            echo "Unable to normalize the Android package list for launcher stabilization." >&2
            exit 1
          fi
          if grep -Fqx "package:$LAUNCHER_PACKAGE" "$launcher_package_list_normalized"; then
            echo "Stopping Pixel Launcher before launching the test APK."
            timeout 30 "$ADB" shell am force-stop "$LAUNCHER_PACKAGE"
          else
            echo "Pixel Launcher package is absent; continuing without launcher stabilization."
          fi
      - name: Cache pinned Maestro CLI
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ~/.cache/maestro/${{ env.MAESTRO_VERSION }}
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}-${{ env.MAESTRO_CACHE_SCHEMA }}
      - name: Install pinned Maestro CLI
        id: maestro_cli
        shell: bash
        run: |
          set -euo pipefail
          MAESTRO_HOME="$HOME/.cache/maestro/$MAESTRO_VERSION"
          MAESTRO_BIN="$MAESTRO_HOME/maestro/bin/maestro"
          MAESTRO_BIN_DIR="$MAESTRO_HOME/maestro/bin"
          mkdir -p "$MAESTRO_HOME"
          cache_valid=false
          if [[ -x "$MAESTRO_BIN" ]]; then
            set +e
            "$MAESTRO_BIN" --version
            maestro_status=$?
            set -e
            if [[ "$maestro_status" -eq 0 ]]; then
              cache_valid=true
              echo "Maestro cache hit: $MAESTRO_HOME"
            else
              echo "Cached Maestro CLI is invalid; rebuilding it from the pinned release."
            fi
          fi
          if [[ "$cache_valid" != true ]]; then
            curl --fail --location --retry 3 \
              "$MAESTRO_DOWNLOAD_URL" \
              --output "$RUNNER_TEMP/maestro.zip"
            unzip -q -o "$RUNNER_TEMP/maestro.zip" -d "$MAESTRO_HOME"
          fi
          test -x "$MAESTRO_BIN"
          "$MAESTRO_BIN" --version
          echo "$MAESTRO_BIN_DIR" >> "$GITHUB_PATH"
          echo "MAESTRO_BIN=$MAESTRO_BIN" >> "$GITHUB_ENV"
      - name: Check Android adb root capability
        id: android_adb_root
        if: ${{ !cancelled() && inputs.capture_spec_visuals == true && steps.android_emulator_ready.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/native-runtime-evidence"
          mkdir -p "$evidence_dir"
          root_output="$evidence_dir/adb-root.txt"
          set +e
          "$ADB" root > "$root_output" 2>&1
          root_command_status=$?
          set -e
          "$ADB" wait-for-device
          sleep 2
          root_id="$("$ADB" shell id | tr -d '\r')"
          root_uid="$("$ADB" shell id -u | tr -d '\r')"
          build_type="$("$ADB" shell getprop ro.build.type | tr -d '\r')"
          build_flavor="$("$ADB" shell getprop ro.build.flavor | tr -d '\r')"
          {
            echo "adb_root_exit=$root_command_status"
            echo "adb_shell_id=$root_id"
            echo "adb_shell_uid=$root_uid"
            echo "build_type=$build_type"
            echo "build_flavor=$build_flavor"
          } | tee -a "$root_output"
          root_available=false
          if [[ "$root_uid" = "0" ]] && printf '%s\n' "$root_id" | grep -Eq 'uid=0\(root\)'; then
            root_available=true
          fi
          echo "adb_root_available=$root_available" | tee -a "$root_output"
          echo "adb_root_available=$root_available" >> "$GITHUB_OUTPUT"
          echo "ADB_ROOT_AVAILABLE=$root_available" >> "$GITHUB_ENV"
      - name: Normalize Android canonical visual profile
        id: android_profile_normalize
        if: ${{ !cancelled() && inputs.capture_spec_visuals == true && steps.android_emulator_ready.outcome == 'success' && steps.maestro_cli.outcome == 'success' && steps.android_adb_root.outcome == 'success' }}
        shell: bash
        run: bash scripts/native/android-ci-visual-profile.sh
      - name: Download Automation Release APK
        if: ${{ !cancelled() && needs.android-automation-build.result == 'success' && steps.android_emulator_ready.outcome == 'success' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-android-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/native-apk
      - name: Verify downloaded Automation Release APK
        if: ${{ !cancelled() && needs.android-automation-build.result == 'success' && steps.android_emulator_ready.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$RUNNER_TEMP/native-apk/native-automation.apk"
          test -f "$APK_PATH"
          test -s "$APK_PATH"
          if ! unzip -l "$APK_PATH" | grep -Eq 'assets/.*\.(bundle|hbc)'; then
            echo "Downloaded Automation Release APK does not contain a JavaScript bundle." >&2
            unzip -l "$APK_PATH" | tail -n 40 >&2
            exit 1
          fi
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
      - name: Install and launch Automation APK
        id: android_automation_install
        if: ${{ !cancelled() && needs.android-automation-build.result == 'success' && steps.android_emulator_ready.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ID="com.ryuyoshikawa.scenarioshop"
          MAIN_ACTIVITY="$PACKAGE_ID/.MainActivity"
          export PACKAGE_ID
          timeout 15 "$ADB" logcat -c
          timeout 180 "$ADB" install -r "$APK_PATH"
          timeout 15 "$ADB" shell pm path "$PACKAGE_ID" | grep -F 'package:'
          activity_resolution_status=1
          for _ in $(seq 1 15); do
            set +e
            resolved_activity="$(timeout 10 "$ADB" shell cmd package resolve-activity --brief \
              -a android.intent.action.MAIN \
              -c android.intent.category.LAUNCHER \
              -p "$PACKAGE_ID" 2>&1)"
            resolve_status=$?
            set -e
            printf '%s\n' "$resolved_activity"
            if [[ "$resolve_status" -eq 0 ]] \
              && printf '%s\n' "$resolved_activity" | grep -Fq "$PACKAGE_ID" \
              && printf '%s\n' "$resolved_activity" | grep -Fq 'MainActivity'; then
              activity_resolution_status=0
              break
            fi
            sleep 2
          done
          if [[ "$activity_resolution_status" -ne 0 ]]; then
            echo "Android launcher activity was not resolvable after installation." >&2
            exit 1
          fi
          timeout 30 "$ADB" shell am start -W -n "$MAIN_ACTIVITY"
          set +e
          timeout 60 bash -c '
            for _ in $(seq 1 30); do
              package_pids="$(timeout 10 "$ADB" shell pidof "$PACKAGE_ID" 2>/dev/null)"
              pid_status=$?
              if [[ "$pid_status" -eq 0 && -n "${package_pids//[[:space:]]/}" ]]; then
                printf "%s\n" "$package_pids"
                exit 0
              fi
              sleep 2
            done
            exit 124
          ' > "$RUNNER_TEMP/app-pid.txt"
          launch_status=$?
          set -e
          stability_status=0
          if [[ "$launch_status" -eq 0 ]]; then
            for check in $(seq 1 6); do
              set +e
              package_pids="$(timeout 10 "$ADB" shell pidof "$PACKAGE_ID" 2>/dev/null)"
              pid_status=$?
              set -e
              if [[ "$pid_status" -ne 0 || -z "${package_pids//[[:space:]]/}" ]]; then
                echo "Android application terminated during startup stability check (sample $check/6)." >&2
                stability_status=1
                break
              fi
              echo "Android application process is alive (sample $check/6): $package_pids"
              if [[ "$check" -lt 6 ]]; then
                sleep 2
              fi
            done
          fi
          set +e
          timeout 30 "$ADB" logcat -d > "$RUNNER_TEMP/app-launch-logcat.txt" 2>&1
          logcat_status=$?
          set -e
          if [[ "$launch_status" -ne 0 || "$stability_status" -ne 0 ]]; then
            echo "Android application process did not remain alive after launch (wait=$launch_status, stability=$stability_status)." >&2
            if [[ -f "$RUNNER_TEMP/app-pid.txt" ]]; then
              cat "$RUNNER_TEMP/app-pid.txt" >&2
            fi
            cat "$RUNNER_TEMP/app-launch-logcat.txt" >&2
            if [[ "$launch_status" -ne 0 ]]; then
              exit "$launch_status"
            fi
            exit 1
          fi
          test "$logcat_status" -eq 0
          app_fatal_pattern='FATAL EXCEPTION|JavascriptException|Maximum call stack size exceeded|Unable to load script|Could not connect to development server|Unable to resolve host'
          if grep -Fq "Process: ${PACKAGE_ID}" "$RUNNER_TEMP/app-launch-logcat.txt"; then
            set +e
            grep -F -B 12 -A 24 "Process: ${PACKAGE_ID}" "$RUNNER_TEMP/app-launch-logcat.txt" \
              | grep -Eiq "$app_fatal_pattern"
            app_fatal_status=$?
            set -e
            if [[ "$app_fatal_status" -eq 0 ]]; then
              echo "Fatal logcat entry was detected for ${PACKAGE_ID}." >&2
              cat "$RUNNER_TEMP/app-launch-logcat.txt" >&2
              exit 1
            fi
          fi
          if grep -Eiq "ReactNativeJS.*($app_fatal_pattern)" "$RUNNER_TEMP/app-launch-logcat.txt"; then
            echo "Fatal React Native logcat entry was detected for ${PACKAGE_ID}." >&2
            cat "$RUNNER_TEMP/app-launch-logcat.txt" >&2
            exit 1
          fi
      - name: Capture Android Screen Catalog baseline
        id: android_visual_capture
        if: ${{ !cancelled() && inputs.capture_spec_visuals == true && steps.android_emulator_ready.outcome == 'success' && steps.android_profile_normalize.outcome == 'success' && steps.android_automation_install.outcome == 'success' && steps.maestro_cli.outcome == 'success' }}
        shell: bash
        env:
