        if: ${{ !cancelled() && needs.android-production-build.result == 'success' && needs.production-bundle-guard.result == 'success' && steps.android_emulator_ready.outcome == 'success' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-android-production-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/native-production-apk
      - name: Verify downloaded Production-validation Release APK
        if: ${{ !cancelled() && needs.android-production-build.result == 'success' && needs.production-bundle-guard.result == 'success' && steps.android_emulator_ready.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTION_APK_PATH="$RUNNER_TEMP/native-production-apk/native-production-validation.apk"
          test -f "$PRODUCTION_APK_PATH"
          test -s "$PRODUCTION_APK_PATH"
          bundle_entries=$(
            unzip -Z1 "$PRODUCTION_APK_PATH" |
              grep -E '^assets/.*\.(bundle|hbc)$' || true
          )
          test -n "$bundle_entries"
          printf 'Guarded Production Hermes candidate entries:\n%s\n' "$bundle_entries"
          echo "PRODUCTION_APK_PATH=$PRODUCTION_APK_PATH" >> "$GITHUB_ENV"
      - name: Install and launch Production-validation APK
        id: production_install
        if: ${{ !cancelled() && needs.android-production-build.result == 'success' && needs.production-bundle-guard.result == 'success' && steps.android_emulator_ready.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ID="com.ryuyoshikawa.scenarioshop"
          timeout 30 "$ADB" shell am force-stop "$PACKAGE_ID" || true
          timeout 30 "$ADB" shell pm clear "$PACKAGE_ID"
          timeout 180 "$ADB" install -r "$PRODUCTION_APK_PATH"
          timeout 15 "$ADB" shell pm path "$PACKAGE_ID" | grep -F 'package:'
          timeout 30 "$ADB" shell monkey \
            -p "$PACKAGE_ID" \
            -c android.intent.category.LAUNCHER \
            1
      - name: Run Maestro Native Production-validation flow
        if: ${{ !cancelled() && needs.production-bundle-guard.result == 'success' && steps.production_install.outcome == 'success' && steps.maestro_cli.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/native/android-maestro-run.sh" \
            --flow "$GITHUB_WORKSPACE/maestro/native-production-validation.yaml" \
            --test-output-dir "$RUNNER_TEMP/maestro-artifacts/production-validation" \
            --junit-output "$RUNNER_TEMP/maestro-production-validation.xml"
      - name: Collect Android evidence
        if: always()
        timeout-minutes: 3
        shell: bash
        env:
          NATIVE_ANDROID_JOB_STATUS: ${{ job.status }}
        run: bash scripts/native/android-ci-runtime-evidence.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: native-android-runtime-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/native-runtime-evidence
          if-no-files-found: warn
          retention-days: 7

  native-ios:
    name: Native iOS CI
    needs: detect
    if: needs.detect.outputs.native_changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/native-ios-ci.yml
    with:
      run_native: true

  verify:
    name: native-ci / verify
    needs:
      [
        detect,
        native-static,
        production-bundle-guard,
        android-automation-build,
        android-production-build,
        android-runtime,
        native-ios,
      ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require stable Native CI result
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          NATIVE_CHANGED: ${{ needs.detect.outputs.native_changed }}
          STATIC_RESULT: ${{ needs.native-static.result }}
          PRODUCTION_RESULT: ${{ needs.production-bundle-guard.result }}
          ANDROID_AUTOMATION_BUILD_RESULT: ${{ needs.android-automation-build.result }}
          ANDROID_PRODUCTION_BUILD_RESULT: ${{ needs.android-production-build.result }}
          ANDROID_RUNTIME_RESULT: ${{ needs.android-runtime.result }}
          IOS_RESULT: ${{ needs.native-ios.result }}
        run: |
          test "$DETECT_RESULT" = success
          test -n "$NATIVE_CHANGED"
          case "$NATIVE_CHANGED" in
            true|false) ;;
            *) echo "Unexpected native_changed output: $NATIVE_CHANGED" >&2; exit 1 ;;
          esac
          if [[ "$NATIVE_CHANGED" == "true" ]]; then
            test "$STATIC_RESULT" = success
            test "$PRODUCTION_RESULT" = success
            test "$ANDROID_AUTOMATION_BUILD_RESULT" = success
            test "$ANDROID_PRODUCTION_BUILD_RESULT" = success
            test "$ANDROID_RUNTIME_RESULT" = success
            test "$IOS_RESULT" = success
          else
            test "$STATIC_RESULT" = skipped
            test "$PRODUCTION_RESULT" = skipped
            test "$ANDROID_AUTOMATION_BUILD_RESULT" = skipped
            test "$ANDROID_PRODUCTION_BUILD_RESULT" = skipped
            test "$ANDROID_RUNTIME_RESULT" = skipped
            test "$IOS_RESULT" = skipped
          fi
          echo "All Native CI gates completed successfully."
