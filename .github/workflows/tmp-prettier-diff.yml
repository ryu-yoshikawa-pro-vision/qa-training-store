name: Temporary Prettier Diff

on:
  push:
    branches:
      - fix/security-fallback-manifest-diagnostics

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.34.5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Show exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          file=tests/contracts/security-dependency-fallback-workflow.test.ts
          cp "$file" "$RUNNER_TEMP/before.ts"
          pnpm exec prettier "$file" --write
          diff -u "$RUNNER_TEMP/before.ts" "$file" || true
