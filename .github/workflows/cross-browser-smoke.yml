name: Cross Browser Smoke

on:
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  NODE_VERSION: "24"
  PNPM_VERSION: "9.10.0"

jobs:
  cross-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    env:
      PLAYWRIGHT_USE_PREBUILT_DIST: "true"
      EXPO_PUBLIC_APP_ENV: automation
      EXPO_PUBLIC_BUILD_KIND: automation
      EXPO_PUBLIC_TEST_MODE: "true"
      EXPO_PUBLIC_DEFAULT_SEED: default
      EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build automation web
        run: pnpm run build:web

      - name: Verify automation artifact
        run: test -f dist/index.html

      - name: Run Cross Browser Smoke
        run: |
          pnpm exec playwright test e2e/web/smoke.spec.ts \
            --project=firefox-smoke \
            --project=webkit-smoke

      - name: Upload Playwright artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-cross-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright
          if-no-files-found: warn
          retention-days: 14
