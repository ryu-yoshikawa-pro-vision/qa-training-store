name: Native iOS CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PNPM_VERSION: 9.10.0
  MAESTRO_VERSION: 2.8.0
  MAESTRO_DOWNLOAD_URL: https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.8.0/maestro.zip
  EXPO_PUBLIC_APP_ENV: automation
  EXPO_PUBLIC_BUILD_KIND: automation
  EXPO_PUBLIC_TEST_MODE: "true"
  EXPO_PUBLIC_DEFAULT_SEED: default

jobs:
  ios:
    name: iOS Simulator Build / Smoke
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26.4.1 or newer
        shell: bash
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate:native-assets
      - run: git diff --exit-code -- src/generated/native-product-assets.ts
      - run: pnpm exec expo prebuild --clean --platform ios --no-install
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Resolve generated workspace and scheme
        id: xcode
        shell: bash
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(j.workspace.schemes[0]||"")})')
          test -n "$SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
      - name: Build iOS Simulator app without signing
        shell: bash
        env:
          WORKSPACE: ${{ steps.xcode.outputs.workspace }}
          SCHEME: ${{ steps.xcode.outputs.scheme }}
        run: |
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Boot iOS Simulator and install app
        shell: bash
        run: |
          DEVICE=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP_PATH=$(find "$RUNNER_TEMP/derived/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          xcrun simctl install "$DEVICE" "$APP_PATH"
          xcrun simctl launch "$DEVICE" com.ryuyoshikawa.scenarioshop
      - name: Install pinned Maestro CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/maestro"
          curl --fail --location --retry 3 "$MAESTRO_DOWNLOAD_URL" --output "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          test -x "$RUNNER_TEMP/maestro/maestro/bin/maestro"
          "$RUNNER_TEMP/maestro/maestro/bin/maestro" --version
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Reset Test Control and run iOS smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maestro-artifacts"
          DEVICE=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          test -n "$DEVICE"
          maestro test "$GITHUB_WORKSPACE/maestro/native-test-control.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/test-control" \
            --format junit --output "$RUNNER_TEMP/maestro-test-control.xml"
          maestro test "$GITHUB_WORKSPACE/maestro/native-contract-harness.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/contract-harness" \
            --format junit --output "$RUNNER_TEMP/maestro-contract-harness.xml"
          maestro test "$GITHUB_WORKSPACE/maestro/native-not-found.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/not-found" \
            --format junit --output "$RUNNER_TEMP/maestro-not-found.xml"
          maestro test "$GITHUB_WORKSPACE/maestro/native-storefront.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/storefront" \
            --format junit --output "$RUNNER_TEMP/maestro-storefront.xml"
          maestro test "$GITHUB_WORKSPACE/maestro/native-cart.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/cart" \
            --format junit --output "$RUNNER_TEMP/maestro-cart.xml"
          maestro test "$GITHUB_WORKSPACE/maestro/native-restart-persistence.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/restart-persistence" \
            --format junit --output "$RUNNER_TEMP/maestro-restart-persistence.xml"
          maestro test "$GITHUB_WORKSPACE/maestro/native-reset-dirty-state.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/reset-dirty-state" \
            --format junit --output "$RUNNER_TEMP/maestro-reset-dirty-state.xml"
          maestro test "$GITHUB_WORKSPACE/maestro/native-out-of-stock.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/out-of-stock" \
            --format junit --output "$RUNNER_TEMP/maestro-out-of-stock.xml"
          maestro test "$GITHUB_WORKSPACE/maestro/native-low-stock.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/low-stock" \
            --format junit --output "$RUNNER_TEMP/maestro-low-stock.xml"
          maestro test "$GITHUB_WORKSPACE/maestro/native-purchase-limit.yaml" \
            --test-output-dir="$RUNNER_TEMP/maestro-artifacts/purchase-limit" \
            --format junit --output "$RUNNER_TEMP/maestro-purchase-limit.xml"
      - name: Collect iOS evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-ios-evidence"
          xcrun simctl diagnose "$RUNNER_TEMP/native-ios-evidence/simctl-diagnose.tar.gz" || true
          cp "$RUNNER_TEMP/maestro-test-control.xml" "$RUNNER_TEMP/native-ios-evidence/maestro-test-control.xml" || true
          cp "$RUNNER_TEMP/maestro-contract-harness.xml" "$RUNNER_TEMP/native-ios-evidence/maestro-contract-harness.xml" || true
          cp "$RUNNER_TEMP/maestro-not-found.xml" "$RUNNER_TEMP/native-ios-evidence/maestro-not-found.xml" || true
          cp "$RUNNER_TEMP/maestro-storefront.xml" "$RUNNER_TEMP/native-ios-evidence/maestro-storefront.xml" || true
          cp "$RUNNER_TEMP/maestro-cart.xml" "$RUNNER_TEMP/native-ios-evidence/maestro-cart.xml" || true
          cp "$RUNNER_TEMP/maestro-restart-persistence.xml" "$RUNNER_TEMP/native-ios-evidence/maestro-restart-persistence.xml" || true
          cp "$RUNNER_TEMP/maestro-reset-dirty-state.xml" "$RUNNER_TEMP/native-ios-evidence/maestro-reset-dirty-state.xml" || true
          cp "$RUNNER_TEMP/maestro-out-of-stock.xml" "$RUNNER_TEMP/native-ios-evidence/maestro-out-of-stock.xml" || true
          cp "$RUNNER_TEMP/maestro-low-stock.xml" "$RUNNER_TEMP/native-ios-evidence/maestro-low-stock.xml" || true
          cp "$RUNNER_TEMP/maestro-purchase-limit.xml" "$RUNNER_TEMP/native-ios-evidence/maestro-purchase-limit.xml" || true
          cp -R "$RUNNER_TEMP/maestro-artifacts" "$RUNNER_TEMP/native-ios-evidence/maestro-artifacts" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/native-ios-evidence
          retention-days: 7
