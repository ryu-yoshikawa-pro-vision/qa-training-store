name: Native iOS CI

on:
  workflow_call:
    inputs:
      run_native:
        required: false
        type: boolean
        default: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PNPM_VERSION: 9.10.0
  MAESTRO_VERSION: 2.8.0
  MAESTRO_DOWNLOAD_URL: https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.8.0/maestro.zip
  EXPO_PUBLIC_APP_ENV: automation
  EXPO_PUBLIC_BUILD_KIND: automation
  EXPO_PUBLIC_TEST_MODE: "true"
  EXPO_PUBLIC_DEFAULT_SEED: default

jobs:
  ios-build:
    name: iOS Simulator Build
    if: inputs.run_native || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26.4.1 or newer
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Native assets
        run: pnpm run generate:native-assets
      - name: Verify generated Native assets
        run: git diff --exit-code -- src/generated/native-product-assets.ts
      - name: Run Expo prebuild
        run: pnpm exec expo prebuild --clean --platform ios --no-install
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Resolve generated workspace and scheme
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          WORKSPACE_SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const expected=process.argv[1];if(!j.workspace.schemes.includes(expected))throw new Error(`Generated workspace does not contain app scheme ${expected}.`);process.stdout.write(expected)})' "$WORKSPACE_SCHEME")
          test -n "$SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
      - name: Build iOS Simulator app without signing
        shell: bash
        env:
          WORKSPACE: ${{ steps.xcode.outputs.workspace }}
          SCHEME: ${{ steps.xcode.outputs.scheme }}
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/ios-build.log"
      - name: Verify iOS Simulator artifact
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/derived/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
      - name: Save Automation iOS Simulator app for Runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_APP_PATH="$RUNNER_TEMP/native-ios-app/native-automation.app"
          mkdir -p "$(dirname "$RUNTIME_APP_PATH")"
          cp -R "$APP_PATH" "$RUNTIME_APP_PATH"
          test -d "$RUNTIME_APP_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: native-ios-app-${{ github.run_id }}
          path: ${{ runner.temp }}/native-ios-app
          if-no-files-found: error
          retention-days: 3
      - name: Collect iOS build evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-ios-build-evidence"
          xcodebuild -version > "$RUNNER_TEMP/native-ios-build-evidence/xcode-version.txt" || true
          if [[ -f "$RUNNER_TEMP/ios-build.log" ]]; then
            cp "$RUNNER_TEMP/ios-build.log" "$RUNNER_TEMP/native-ios-build-evidence/ios-build.log"
          fi
          if [[ -n "${APP_PATH:-}" && -d "$APP_PATH" ]]; then
            find "$APP_PATH" -maxdepth 2 -type f -print | sort > "$RUNNER_TEMP/native-ios-build-evidence/app-files.txt"
          else
            echo "iOS Simulator app was not generated." > "$RUNNER_TEMP/native-ios-build-evidence/app-status.txt"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-build-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/native-ios-build-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Automation runtime metadata
        shell: bash
        env:
          EXPO_PUBLIC_APP_ENV: automation
          EXPO_PUBLIC_BUILD_KIND: automation
          EXPO_PUBLIC_TEST_MODE: "true"
          EXPO_PUBLIC_DEFAULT_SEED: default
        run: |
          set -euo pipefail
          pnpm exec expo config --json > "$RUNNER_TEMP/ios-automation-config.json"
          node -e 'const fs = require("node:fs"); const extra = JSON.parse(fs.readFileSync(process.argv[1], "utf8")).extra ?? {}; for (const [key, expected] of Object.entries({ appEnvironment: "automation", buildKind: "automation", testMode: "true" })) { if (extra[key] !== expected) throw new Error(`${key}=${extra[key] ?? "<missing>"}, expected ${expected}`); }' "$RUNNER_TEMP/ios-automation-config.json"

      - name: Run Production-validation iOS prebuild
        shell: bash
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_BUILD_KIND: production
          EXPO_PUBLIC_TEST_MODE: "false"
          EXPO_PUBLIC_DEFAULT_SEED: default
        run: pnpm exec expo prebuild --clean --platform ios --no-install
      - name: Install Production-validation CocoaPods
        working-directory: ios
        run: pod install
      - name: Resolve Production-validation workspace and scheme
        id: production-xcode
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          WORKSPACE_SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const expected=process.argv[1];if(!j.workspace.schemes.includes(expected))throw new Error(`Generated workspace does not contain app scheme ${expected}.`);process.stdout.write(expected)})' "$WORKSPACE_SCHEME")
          test -n "$SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
      - name: Verify Production-validation runtime metadata
        shell: bash
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_BUILD_KIND: production
          EXPO_PUBLIC_TEST_MODE: "false"
          EXPO_PUBLIC_DEFAULT_SEED: default
        run: |
          set -euo pipefail
          pnpm exec expo config --json > "$RUNNER_TEMP/ios-production-config.json"
          node -e 'const fs = require("node:fs"); const extra = JSON.parse(fs.readFileSync(process.argv[1], "utf8")).extra ?? {}; for (const [key, expected] of Object.entries({ appEnvironment: "production", buildKind: "production", testMode: "false" })) { if (extra[key] !== expected) throw new Error(`${key}=${extra[key] ?? "<missing>"}, expected ${expected}`); }' "$RUNNER_TEMP/ios-production-config.json"
      - name: Build Production-validation iOS Simulator app without signing
        shell: bash
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_BUILD_KIND: production
          EXPO_PUBLIC_TEST_MODE: "false"
          EXPO_PUBLIC_DEFAULT_SEED: default
          WORKSPACE: ${{ steps.production-xcode.outputs.workspace }}
          SCHEME: ${{ steps.production-xcode.outputs.scheme }}
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/production-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/ios-production-build.log"
      - name: iOS Production Validation / Bundle Guard
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTION_BUILD_APP_PATH=$(find "$RUNNER_TEMP/production-derived/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$PRODUCTION_BUILD_APP_PATH"
          test -d "$PRODUCTION_BUILD_APP_PATH"
          if grep -R -E '__SCENARIO_SHOP_NATIVE_AUTOMATION__|__SCENARIO_SHOP_NATIVE_CONTRACT_HARNESS__|NativeTestControlService' "$PRODUCTION_BUILD_APP_PATH"; then
            echo "Production iOS app contains Automation/Test Control markers." >&2
            exit 1
          fi
          echo "PRODUCTION_BUILD_APP_PATH=$PRODUCTION_BUILD_APP_PATH" >> "$GITHUB_ENV"
      - name: Save Production-validation iOS Simulator app for Runtime
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTION_APP_PATH="$RUNNER_TEMP/native-ios-production-app/native-production-validation.app"
          mkdir -p "$(dirname "$PRODUCTION_APP_PATH")"
          cp -R "$PRODUCTION_BUILD_APP_PATH" "$PRODUCTION_APP_PATH"
          test -d "$PRODUCTION_APP_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: native-ios-production-app-${{ github.run_id }}
          path: ${{ runner.temp }}/native-ios-production-app
          if-no-files-found: error
          retention-days: 3
      - name: Collect iOS production build evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-ios-production-evidence"
          if [[ -f "$RUNNER_TEMP/ios-production-build.log" ]]; then
            cp "$RUNNER_TEMP/ios-production-build.log" "$RUNNER_TEMP/native-ios-production-evidence/ios-production-build.log"
          fi
          xcodebuild -version > "$RUNNER_TEMP/native-ios-production-evidence/xcode-version.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-production-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/native-ios-production-evidence
          if-no-files-found: warn
          retention-days: 7

  ios-runtime:
    name: iOS Simulator Runtime / Maestro
    needs: ios-build
    if: inputs.run_native || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-ios-app-${{ github.run_id }}
          path: ${{ runner.temp }}/native-ios-app
      - uses: actions/download-artifact@v4
        with:
          name: native-ios-production-app-${{ github.run_id }}
          path: ${{ runner.temp }}/native-ios-production-app
      - name: Boot iOS Simulator and install artifact
        id: ios_runtime_ready
        shell: bash
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP_PATH="$RUNNER_TEMP/native-ios-app/native-automation.app"
          test -d "$APP_PATH"
          xcrun simctl install "$DEVICE" "$APP_PATH"
          xcrun simctl launch "$DEVICE" com.ryuyoshikawa.scenarioshop
          echo "IOS_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
      - name: Install pinned Maestro CLI
        id: maestro_cli
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maestro"
          curl --fail --location --retry 3 "$MAESTRO_DOWNLOAD_URL" --output "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          test -x "$RUNNER_TEMP/maestro/maestro/bin/maestro"
          "$RUNNER_TEMP/maestro/maestro/bin/maestro" --version
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Run iOS Native Customer Maestro flows
        if: ${{ !cancelled() && steps.ios_runtime_ready.outcome == 'success' && steps.maestro_cli.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maestro-artifacts"
          overall_status=0
          run_flow() {
            local name="$1"
            local flow="$2"
            local output_dir="$RUNNER_TEMP/maestro-artifacts/$name"
            local junit="$RUNNER_TEMP/maestro-$name.xml"
            mkdir -p "$output_dir"
            echo "flow=$name"
            echo "start_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            set +e
            maestro test "$GITHUB_WORKSPACE/maestro/$flow" \
              --device "$IOS_DEVICE" \
              --test-output-dir="$output_dir" \
              --format junit --output "$junit"
            local status=$?
            set -e
            echo "result=$([[ "$status" -eq 0 ]] && echo PASS || echo FAIL)"
            echo "exit_code=$status"
            echo "finish_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [[ "$status" -ne 0 ]]; then
              overall_status=1
            fi
          }
          run_flow test-control native-test-control.yaml
          run_flow contract-harness native-contract-harness.yaml
          run_flow not-found native-not-found.yaml
          run_flow storefront native-storefront.yaml
          run_flow cart native-cart.yaml
          run_flow search-input native-search.yaml
          run_flow restart-persistence native-restart-persistence.yaml
          run_flow reset-dirty-state native-reset-dirty-state.yaml
          run_flow boundary-out-of-stock native-out-of-stock.yaml
          run_flow boundary-low-stock native-low-stock.yaml
          run_flow boundary-purchase-limit native-purchase-limit.yaml
          run_flow purchase native-purchase.yaml
          run_flow payment-retry native-payment-retry.yaml
          run_flow session-checkout-restart native-session-checkout-restart.yaml
          run_flow review native-review.yaml
          exit "$overall_status"
      - name: Install and launch Production-validation Simulator app
        id: production_install
        if: ${{ !cancelled() && steps.ios_runtime_ready.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTION_APP_PATH="$RUNNER_TEMP/native-ios-production-app/native-production-validation.app"
          test -d "$PRODUCTION_APP_PATH"
          xcrun simctl terminate "$IOS_DEVICE" com.ryuyoshikawa.scenarioshop || true
          xcrun simctl install "$IOS_DEVICE" "$PRODUCTION_APP_PATH"
          xcrun simctl launch "$IOS_DEVICE" com.ryuyoshikawa.scenarioshop
      - name: Run iOS Production-validation Maestro flow
        if: ${{ !cancelled() && steps.production_install.outcome == 'success' && steps.maestro_cli.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          flow_name="production-validation"
          output_dir="$RUNNER_TEMP/maestro-artifacts/$flow_name"
          junit_path="$RUNNER_TEMP/maestro-$flow_name.xml"
          flow_path="$GITHUB_WORKSPACE/maestro/native-production-validation.yaml"
          mkdir -p "$output_dir"
          echo "flow=$flow_name"
          echo "start_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          maestro test "$flow_path" \
            --device "$IOS_DEVICE" \
            --test-output-dir="$output_dir" \
            --format junit \
            --output "$junit_path"
          flow_exit=$?
          set -e
          echo "result=$([[ "$flow_exit" -eq 0 ]] && echo PASS || echo FAIL)"
          echo "exit_code=$flow_exit"
          echo "finish_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          exit "$flow_exit"
      - name: Collect iOS runtime evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-ios-runtime-evidence"
          xcodebuild -version > "$RUNNER_TEMP/native-ios-runtime-evidence/xcode-version.txt" || true
          xcrun simctl list runtimes > "$RUNNER_TEMP/native-ios-runtime-evidence/simulator-runtimes.txt" || true
          xcrun simctl list devices available > "$RUNNER_TEMP/native-ios-runtime-evidence/simulator-devices.txt" || true
          printf 'device_id=%s\n' "${IOS_DEVICE:-<unset>}" \
            > "$RUNNER_TEMP/native-ios-runtime-evidence/selected-device.txt"
           if [[ -n "${IOS_DEVICE:-}" ]]; then
             xcrun simctl listapps "$IOS_DEVICE" \
               > "$RUNNER_TEMP/native-ios-runtime-evidence/installed-apps.txt" || true
           else
             echo "Simulator device was not resolved." \
               > "$RUNNER_TEMP/native-ios-runtime-evidence/installed-apps.txt"
           fi
           mkdir -p "$RUNNER_TEMP/native-ios-runtime-evidence/simctl-diagnose"
           xcrun simctl diagnose \
             --output "$RUNNER_TEMP/native-ios-runtime-evidence/simctl-diagnose" \
             --no-archive || true
          if [[ -d "$RUNNER_TEMP/maestro-artifacts" ]]; then
            cp -R "$RUNNER_TEMP/maestro-artifacts" "$RUNNER_TEMP/native-ios-runtime-evidence/maestro-artifacts"
          fi
          for junit in "$RUNNER_TEMP"/maestro-*.xml; do
            [[ -f "$junit" ]] && cp "$junit" "$RUNNER_TEMP/native-ios-runtime-evidence/"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-runtime-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/native-ios-runtime-evidence
          if-no-files-found: warn
          retention-days: 7
