# Project-scoped Codex config baseline.
# Codex loads this file only after the project is trusted. The wrappers still pass
# explicit sandbox/approval flags and block unsafe overrides.

sandbox_mode = "workspace-write"
web_search = "cached"
allow_login_shell = false

[sandbox_workspace_write]
network_access = false
writable_roots = []

[shell_environment_policy]
inherit = "core"

[features]
hooks = true

[agents]
max_threads = 4
max_depth = 1
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "node \"$(git rev-parse --show-toplevel)/.codex/hooks/pre_tool_use_policy.mjs\""
command_windows = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$(git rev-parse --show-toplevel)\\.codex\\hooks\\pre_tool_use_policy_windows.ps1"'
timeout = 30
statusMessage = "Checking Bash command safety policy"

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" UserPromptSubmit || true"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -Command $current = [System.IO.DirectoryInfo]((Get-Location).Path); $logger = $null; while ($null -ne $current) { $candidate = Join-Path $current.FullName '.codex/hooks/log_event.mjs'; if (Test-Path -LiteralPath $candidate -PathType Leaf) { $logger = $candidate; break }; $parent = $current.Parent; if ($null -eq $parent -or $parent.FullName -eq $current.FullName) { break }; $current = $parent }; if ($logger -and (Get-Command node -CommandType Application -ErrorAction SilentlyContinue)) { try { node $logger UserPromptSubmit } catch {} }; exit 0"
timeout = 5

[[hooks.PostToolUse]]

[[hooks.PostToolUse.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" PostToolUse || true"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -Command $current = [System.IO.DirectoryInfo]((Get-Location).Path); $logger = $null; while ($null -ne $current) { $candidate = Join-Path $current.FullName '.codex/hooks/log_event.mjs'; if (Test-Path -LiteralPath $candidate -PathType Leaf) { $logger = $candidate; break }; $parent = $current.Parent; if ($null -eq $parent -or $parent.FullName -eq $current.FullName) { break }; $current = $parent }; if ($logger -and (Get-Command node -CommandType Application -ErrorAction SilentlyContinue)) { try { node $logger PostToolUse } catch {} }; exit 0"
timeout = 5

[[hooks.SubagentStart]]

[[hooks.SubagentStart.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" SubagentStart || true"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -Command $current = [System.IO.DirectoryInfo]((Get-Location).Path); $logger = $null; while ($null -ne $current) { $candidate = Join-Path $current.FullName '.codex/hooks/log_event.mjs'; if (Test-Path -LiteralPath $candidate -PathType Leaf) { $logger = $candidate; break }; $parent = $current.Parent; if ($null -eq $parent -or $parent.FullName -eq $current.FullName) { break }; $current = $parent }; if ($logger -and (Get-Command node -CommandType Application -ErrorAction SilentlyContinue)) { try { node $logger SubagentStart } catch {} }; exit 0"
timeout = 5

[[hooks.SubagentStop]]

[[hooks.SubagentStop.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" SubagentStop || printf '{}'"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -Command $current = [System.IO.DirectoryInfo]((Get-Location).Path); $logger = $null; while ($null -ne $current) { $candidate = Join-Path $current.FullName '.codex/hooks/log_event.mjs'; if (Test-Path -LiteralPath $candidate -PathType Leaf) { $logger = $candidate; break }; $parent = $current.Parent; if ($null -eq $parent -or $parent.FullName -eq $current.FullName) { break }; $current = $parent }; if ($logger -and (Get-Command node -CommandType Application -ErrorAction SilentlyContinue)) { try { node $logger SubagentStop; if ($LASTEXITCODE -ne 0) { [Console]::Write('{}') } } catch { [Console]::Write('{}') } } else { [Console]::Write('{}') }; exit 0"
timeout = 5

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" Stop || printf '{}'"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -Command $current = [System.IO.DirectoryInfo]((Get-Location).Path); $logger = $null; while ($null -ne $current) { $candidate = Join-Path $current.FullName '.codex/hooks/log_event.mjs'; if (Test-Path -LiteralPath $candidate -PathType Leaf) { $logger = $candidate; break }; $parent = $current.Parent; if ($null -eq $parent -or $parent.FullName -eq $current.FullName) { break }; $current = $parent }; if ($logger -and (Get-Command node -CommandType Application -ErrorAction SilentlyContinue)) { try { node $logger Stop; if ($LASTEXITCODE -ne 0) { [Console]::Write('{}') } } catch { [Console]::Write('{}') } } else { [Console]::Write('{}') }; exit 0"
timeout = 5
