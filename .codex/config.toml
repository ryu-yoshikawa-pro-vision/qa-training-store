# Project-scoped Codex config baseline.
# Codex loads this file only after the project is trusted. The wrappers still pass
# explicit sandbox/approval flags and block unsafe overrides.

sandbox_mode = "workspace-write"
web_search = "cached"
allow_login_shell = false

[sandbox_workspace_write]
network_access = false
writable_roots = []

[shell_environment_policy]
inherit = "core"

[features]
hooks = true

[agents]
max_threads = 4
max_depth = 1
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "node \"$(git rev-parse --show-toplevel)/.codex/hooks/pre_tool_use_policy.mjs\""
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand  2>NUL"
timeout = 30
statusMessage = "Checking Bash command safety policy"

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" UserPromptSubmit || true"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand  2>NUL"
timeout = 10

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && [ -f \"$repo_root/.codex/hooks/text_quality_gate.mjs\" ] && node \"$repo_root/.codex/hooks/text_quality_gate.mjs\" UserPromptSubmit || true"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand  2>NUL"
timeout = 10

[[hooks.PostToolUse]]

[[hooks.PostToolUse.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" PostToolUse || true"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand  2>NUL"
timeout = 10

[[hooks.PostToolUse.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && [ -f \"$repo_root/.codex/hooks/text_quality_gate.mjs\" ] && node \"$repo_root/.codex/hooks/text_quality_gate.mjs\" PostToolUse || true"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand  2>NUL"
timeout = 10

[[hooks.SubagentStart]]

[[hooks.SubagentStart.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" SubagentStart || true"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand  2>NUL"
timeout = 10

[[hooks.SubagentStop]]

[[hooks.SubagentStop.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" SubagentStop || printf '{}'"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand  2>NUL"
timeout = 10

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" Stop || printf '{}'"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand  2>NUL"
timeout = 10

[[hooks.Stop.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && [ -f \"$repo_root/.codex/hooks/text_quality_gate.mjs\" ] && node \"$repo_root/.codex/hooks/text_quality_gate.mjs\" Stop || printf '%s\\n' '{\"decision\":\"block\",\"reason\":\"Text quality check unavailable; completion cannot be confirmed.\"}'"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand  2>NUL"
timeout = 10
