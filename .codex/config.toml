# Project-scoped Codex config baseline.
# Codex loads this file only after the project is trusted. The wrappers still pass
# explicit sandbox/approval flags and block unsafe overrides.

sandbox_mode = "workspace-write"
web_search = "cached"
allow_login_shell = false

[sandbox_workspace_write]
network_access = false
writable_roots = []

[shell_environment_policy]
inherit = "core"

[features]
hooks = true

[agents]
max_threads = 4
max_depth = 1
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "node \"$(git rev-parse --show-toplevel)/.codex/hooks/pre_tool_use_policy.mjs\""
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand  2>NUL"
timeout = 30
statusMessage = "Checking Bash command safety policy"

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" UserPromptSubmit || true"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand  2>NUL"
timeout = 10

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "diagnostic='{\"continue\":true,\"systemMessage\":\"Codex text quality hook: UserPromptSubmit launcher unavailable\"}'\nrepo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" || { printf '%s\\n' \"$diagnostic\"; exit 0; }\nhook=\"$repo_root/.codex/hooks/text_quality_gate.mjs\"\nif ! command -v node >/dev/null 2>&1 || [ ! -f \"$hook\" ]; then printf '%s\\n' \"$diagnostic\"; exit 0; fi\noutput_file=\"\"\nerror_file=\"\"\ncleanup() { [ -z \"$output_file\" ] || rm -f \"$output_file\"; [ -z \"$error_file\" ] || rm -f \"$error_file\"; }\ntrap cleanup EXIT\noutput_file=\"$(mktemp \"${TMPDIR:-/tmp}/codex-text-quality-userprompt.XXXXXX\" 2>/dev/null)\" || output_file=\"\"\nerror_file=\"$(mktemp \"${TMPDIR:-/tmp}/codex-text-quality-userprompt.XXXXXX\" 2>/dev/null)\" || error_file=\"\"\nif [ -z \"$output_file\" ] || [ -z \"$error_file\" ]; then printf '%s\\n' \"$diagnostic\"; exit 0; fi\nnode \"$hook\" UserPromptSubmit >\"$output_file\" 2>\"$error_file\"\nstatus=$?\nif [ \"$status\" -ne 0 ]; then printf '%s\\n' \"$diagnostic\"; exit 0; fi\ncat \"$output_file\"\ncat \"$error_file\" >&2\nexit 0"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand "
timeout = 10

[[hooks.PostToolUse]]

[[hooks.PostToolUse.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" PostToolUse || true"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand  2>NUL"
timeout = 10

[[hooks.PostToolUse.hooks]]
type = "command"
command = "diagnostic='{\"continue\":true,\"systemMessage\":\"Codex text quality hook: PostToolUse launcher unavailable\"}'\nrepo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" || { printf '%s\\n' \"$diagnostic\"; exit 0; }\nhook=\"$repo_root/.codex/hooks/text_quality_gate.mjs\"\nif ! command -v node >/dev/null 2>&1 || [ ! -f \"$hook\" ]; then printf '%s\\n' \"$diagnostic\"; exit 0; fi\noutput_file=\"\"\nerror_file=\"\"\ncleanup() { [ -z \"$output_file\" ] || rm -f \"$output_file\"; [ -z \"$error_file\" ] || rm -f \"$error_file\"; }\ntrap cleanup EXIT\noutput_file=\"$(mktemp \"/tmp/codex-text-quality-posttool.XXXXXX\" 2>/dev/null)\" || output_file=\"\"\nerror_file=\"$(mktemp \"/tmp/codex-text-quality-posttool.XXXXXX\" 2>/dev/null)\" || error_file=\"\"\nif [ -z \"$output_file\" ] || [ -z \"$error_file\" ]; then printf '%s\\n' \"$diagnostic\"; exit 0; fi\nnode \"$hook\" PostToolUse >\"$output_file\" 2>\"$error_file\"\nstatus=$?\nif [ \"$status\" -ne 0 ]; then printf '%s\\n' \"$diagnostic\"; exit 0; fi\ncat \"$output_file\"\ncat \"$error_file\" >&2\nexit 0"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand "
timeout = 10

[[hooks.SubagentStart]]

[[hooks.SubagentStart.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" SubagentStart || true"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand  2>NUL"
timeout = 10

[[hooks.SubagentStop]]

[[hooks.SubagentStop.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" SubagentStop || printf '{}'"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand  2>NUL"
timeout = 10

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" Stop || printf '{}'"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand  2>NUL"
timeout = 10

[[hooks.Stop.hooks]]
type = "command"
command = "payload=\"$(cat)\"\nfallback='{\"decision\":\"block\",\"reason\":\"Text quality check unavailable; completion cannot be confirmed.\"}'\nactive_diagnostic='{\"continue\":true,\"systemMessage\":\"Codex text quality hook: Stop launcher unavailable\"}'\nrepo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" || repo_root=\"\"\nhook=\"\"\nif [ -n \"$repo_root\" ] && command -v node >/dev/null 2>&1; then\n  hook=\"$repo_root/.codex/hooks/text_quality_gate.mjs\"\nfi\nif [ -n \"$hook\" ] && [ -f \"$hook\" ]; then\n  tmp_dir=\"$TMPDIR\"\n  if [ -z \"$tmp_dir\" ]; then tmp_dir=\"/tmp\"; fi\n  output_file=\"$(mktemp \"$tmp_dir/codex-text-quality-stop.XXXXXX\" 2>/dev/null)\" || output_file=\"\"\n  error_file=\"$(mktemp \"$tmp_dir/codex-text-quality-stop.XXXXXX\" 2>/dev/null)\" || error_file=\"\"\n  if [ -n \"$output_file\" ] && [ -n \"$error_file\" ]; then\n    if printf '%s' \"$payload\" | node \"$hook\" Stop >\"$output_file\" 2>\"$error_file\"; then\n      cat \"$output_file\"\n      cat \"$error_file\" >&2\n      rm -f \"$output_file\" \"$error_file\"\n      exit 0\n    fi\n  fi\n  [ -n \"$output_file\" ] && rm -f \"$output_file\"\n  [ -n \"$error_file\" ] && rm -f \"$error_file\"\nfi\nif command -v node >/dev/null 2>&1; then\n  if printf '%s' \"$payload\" | CODEX_QUALITY_REPO_ROOT=\"$repo_root\" node -e 'const fs = require(\"fs\"); const crypto = require(\"crypto\"); const path = require(\"path\"); try { const value = JSON.parse(fs.readFileSync(0, \"utf8\")); if (!value || typeof value !== \"object\" || Array.isArray(value) || value.stop_hook_active !== true) process.exit(1); const sessionId = value.session_id; const root = process.env.CODEX_QUALITY_REPO_ROOT; if (typeof sessionId !== \"string\" || sessionId.length === 0 || typeof root !== \"string\" || root.length === 0) process.exit(0); const sessionHash = crypto.createHash(\"sha256\").update(sessionId, \"utf8\").digest(\"hex\"); const stateDir = path.join(root, \".artifacts\", \"codex-text-quality\"); try { for (const entry of fs.readdirSync(stateDir, { withFileTypes: true })) { if (entry.isFile() && entry.name.endsWith(\"-\" + sessionHash + \".json\")) { try { fs.unlinkSync(path.join(stateDir, entry.name)); } catch {} } } } catch {} process.exit(0); } catch { process.exit(1) }' >/dev/null 2>&1; then\n    printf '%s\\n' \"$active_diagnostic\"\n    exit 0\n  fi\nfi\nparser=\"\"\nif command -v python3 >/dev/null 2>&1; then\n  parser=python3\nelif command -v python >/dev/null 2>&1; then\n  parser=python\nfi\nif [ -n \"$parser\" ]; then\n  if printf '%s' \"$payload\" | CODEX_QUALITY_REPO_ROOT=\"$repo_root\" \"$parser\" -c '\nimport hashlib\nimport json\nimport os\nimport sys\n\nvalue = json.load(sys.stdin)\nif not isinstance(value, dict) or value.get(\"stop_hook_active\") is not True:\n    raise SystemExit(1)\nsession_id = value.get(\"session_id\")\nroot = os.environ.get(\"CODEX_QUALITY_REPO_ROOT\", \"\")\nif not isinstance(session_id, str) or not session_id or not root:\n    raise SystemExit(0)\nsession_hash = hashlib.sha256(session_id.encode(\"utf-8\")).hexdigest()\nstate_dir = os.path.join(root, \".artifacts\", \"codex-text-quality\")\ntry:\n    entries = os.listdir(state_dir)\nexcept OSError:\n    entries = []\nfor name in entries:\n    if name.endswith(\"-\" + session_hash + \".json\"):\n        candidate = os.path.join(state_dir, name)\n        try:\n            if os.path.isfile(candidate):\n                os.unlink(candidate)\n        except OSError:\n            pass\n' >/dev/null 2>&1; then\n    printf '%s\\n' \"$active_diagnostic\"\n    exit 0\n  fi\nfi\nprintf '%s\\n' \"$fallback\"\nexit 0"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand  2>NUL"
timeout = 10
[[hooks.SessionStart]]
matcher = "^compact$"

[[hooks.SessionStart.hooks]]
type = "command"
command = "payload=\"$(cat)\"\nfallback='{\"continue\":false,\"stopReason\":\"compact後の必須指示を再注入できませんでした: Hook launcher failure\"}'\nrepo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" || repo_root=\"\"\nhook=\"\"\nif [ -n \"$repo_root\" ] && command -v node >/dev/null 2>&1; then\n  hook=\"$repo_root/.codex/hooks/session_start_context.mjs\"\nfi\nif [ -n \"$hook\" ] && [ -f \"$hook\" ]; then\n  output_file=\"$(mktemp \"${TMPDIR:-/tmp}/codex-session-start.XXXXXX\" 2>/dev/null)\" || output_file=\"\"\n  error_file=\"$(mktemp \"${TMPDIR:-/tmp}/codex-session-start.XXXXXX\" 2>/dev/null)\" || error_file=\"\"\n  if [ -n \"$output_file\" ] && [ -n \"$error_file\" ]; then\n    if printf '%s' \"$payload\" | node \"$hook\" >\"$output_file\" 2>\"$error_file\"; then\n      cat \"$output_file\"\n      cat \"$error_file\" >&2\n      rm -f \"$output_file\" \"$error_file\"\n      exit 0\n    fi\n  fi\n  [ -n \"$output_file\" ] && rm -f \"$output_file\"\n  [ -n \"$error_file\" ] && rm -f \"$error_file\"\nfi\nprintf '%s\\n' \"$fallback\"\nexit 0"
command_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand  2>NUL"
timeout = 10
additionalContextLimit = 4096
