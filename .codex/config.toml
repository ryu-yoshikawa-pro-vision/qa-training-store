# Project-scoped Codex config baseline.
# Codex loads this file only after the project is trusted. The wrappers still pass
# explicit sandbox/approval flags and block unsafe overrides.

sandbox_mode = "workspace-write"
web_search = "cached"
allow_login_shell = false

[sandbox_workspace_write]
network_access = false
writable_roots = []

[shell_environment_policy]
inherit = "core"

[features]
hooks = true

[agents]
max_threads = 4
max_depth = 1
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "node \"$(git rev-parse --show-toplevel)/.codex/hooks/pre_tool_use_policy.mjs\""
command_windows = "cmd.exe /D /Q /S /C \"for /f \"delims=\" %i in ('git rev-parse --show-toplevel 2^>NUL') do powershell.exe -NoProfile -ExecutionPolicy Bypass -File \"%i\\.codex\\hooks\\pre_tool_use_policy_windows.ps1\"\""
timeout = 30
statusMessage = "Checking Bash command safety policy"

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" UserPromptSubmit || true"
command_windows = "cmd.exe /D /Q /S /C \"for /f \"delims=\" %i in ('git rev-parse --show-toplevel 2^>NUL') do if exist \"%i\\.codex\\hooks\\log_event.mjs\" node \"%i\\.codex\\hooks\\log_event.mjs\" UserPromptSubmit\" || cmd.exe /D /Q /S /C exit 0"
timeout = 10

[[hooks.PostToolUse]]

[[hooks.PostToolUse.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" PostToolUse || true"
command_windows = "cmd.exe /D /Q /S /C \"for /f \"delims=\" %i in ('git rev-parse --show-toplevel 2^>NUL') do if exist \"%i\\.codex\\hooks\\log_event.mjs\" node \"%i\\.codex\\hooks\\log_event.mjs\" PostToolUse\" || cmd.exe /D /Q /S /C exit 0"
timeout = 10

[[hooks.SubagentStart]]

[[hooks.SubagentStart.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" SubagentStart || true"
command_windows = "cmd.exe /D /Q /S /C \"for /f \"delims=\" %i in ('git rev-parse --show-toplevel 2^>NUL') do if exist \"%i\\.codex\\hooks\\log_event.mjs\" node \"%i\\.codex\\hooks\\log_event.mjs\" SubagentStart\" || cmd.exe /D /Q /S /C exit 0"
timeout = 10

[[hooks.SubagentStop]]

[[hooks.SubagentStop.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" SubagentStop || printf '{}'"
command_windows = "cmd.exe /D /Q /S /C \"for /f \"delims=\" %i in ('git rev-parse --show-toplevel 2^>NUL') do if exist \"%i\\.codex\\hooks\\log_event.mjs\" (node \"%i\\.codex\\hooks\\log_event.mjs\" SubagentStop) else (powershell.exe -NoProfile -EncodedCommand WwBDAG8AbgBzAG8AbABlAF0AOgA6AFcAcgBpAHQAZQAoACcAewB9ACcAKQA=)\" || powershell.exe -NoProfile -EncodedCommand WwBDAG8AbgBzAG8AbABlAF0AOgA6AFcAcgBpAHQAZQAoACcAewB9ACcAKQA="
timeout = 10

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "repo_root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" && command -v node >/dev/null 2>&1 && logger=\"$repo_root/.codex/hooks/log_event.mjs\" && [ -f \"$logger\" ] && node \"$logger\" Stop || printf '{}'"
command_windows = "cmd.exe /D /Q /S /C \"for /f \"delims=\" %i in ('git rev-parse --show-toplevel 2^>NUL') do if exist \"%i\\.codex\\hooks\\log_event.mjs\" (node \"%i\\.codex\\hooks\\log_event.mjs\" Stop) else (powershell.exe -NoProfile -EncodedCommand WwBDAG8AbgBzAG8AbABlAF0AOgA6AFcAcgBpAHQAZQAoACcAewB9ACcAKQA=)\" || powershell.exe -NoProfile -EncodedCommand WwBDAG8AbgBzAG8AbABlAF0AOgA6AFcAcgBpAHQAZQAoACcAewB9ACcAKQA="
timeout = 10
