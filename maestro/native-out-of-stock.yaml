appId: com.ryuyoshikawa.scenarioshop
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Native test runtime listening"
    timeout: 30000
- assertVisible: "Scenario Shop"
- openLink: "scenario-shop://test-control/reset?version=1&scenario=out-of-stock&clock=2026-07-01T03%3A00%3A00.000Z&paymentDelayMs=0"
- runFlow: subflows/accept-ios-deep-link.yaml
- extendedWaitUntil:
    visible: "Native test runtime ready"
    timeout: 30000
- openLink: "scenario-shop://products/product-basic-shirt"
- runFlow: subflows/accept-ios-deep-link.yaml
- extendedWaitUntil:
    visible:
      id: "native-product-detail-screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "native-variant-variant-basic-shirt-02"
    direction: DOWN
    speed: 10
    centerElement: true
    timeout: 30000
- tapOn:
    id: "native-variant-variant-basic-shirt-02"
- assertVisible: "M（在庫切れ）"
- assertVisible: "在庫切れ"
- assertVisible:
    id: "native-add-to-cart"
    enabled: false
- tapOn:
    id: "native-nav-cart"
- assertVisible:
    id: "native-cart-screen"
- assertVisible: "カートは空です"
- takeScreenshot: native-out-of-stock
