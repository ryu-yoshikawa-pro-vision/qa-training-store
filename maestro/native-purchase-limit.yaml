appId: com.ryuyoshikawa.scenarioshop
---
- launchApp:
    clearState: true
- assertVisible: "Scenario Shop"
- extendedWaitUntil:
    visible: "Native test runtime listening"
    timeout: 30000
- openLink: "scenario-shop://test-control/reset?version=1&scenario=default&clock=2026-07-01T03%3A00%3A00.000Z&paymentDelayMs=0"
- extendedWaitUntil:
    visible: "Native test runtime ready"
    timeout: 30000
- openLink: "scenario-shop://products/product-basic-shirt"
- extendedWaitUntil:
    visible:
      id: "native-product-detail-screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "native-variant-variant-basic-shirt-02"
    direction: DOWN
    speed: 10
    centerElement: true
    timeout: 30000
- tapOn:
    id: "native-variant-variant-basic-shirt-02"
- assertVisible: "1回の購入上限は5点です。"
- scrollUntilVisible:
    element:
      id: "native-add-to-cart"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "native-add-to-cart"
- tapOn:
    id: "native-go-cart"
- tapOn: "＋"
- tapOn: "＋"
- tapOn: "＋"
- tapOn: "＋"
- assertVisible: "5"
- assertVisible: "購入可能な上限に達しました。"
- assertVisible:
    text: "＋"
    enabled: false
- assertVisible: "5"
- takeScreenshot: native-purchase-limit
