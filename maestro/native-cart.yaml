- openLink: "scenario-shop://test-control/reset?version=1&scenario=default&clock=2026-07-01T03%3A00%3A00.000Z&paymentDelayMs=0"
- extendedWaitUntil:
    visible: "Native test runtime ready"
    timeout: 30000
- tapOn: "商品一覧"
- assertVisible: "商品一覧"
- tapOn: "商品名・コードで検索"
- inputText: "Tシャツ"
- tapOn: "検索"
- tapOn: "ベーシックTシャツ"
- tapOn: "M"
- tapOn: "カートに追加"
- assertVisible: "カートに追加しました"
- tapOn: "カートを見る"
- assertVisible: "カート"
- tapOn: "＋"
- assertVisible: "2"
- tapOn: "−"
- assertVisible: "1"
