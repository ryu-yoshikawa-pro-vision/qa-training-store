appId: com.ryuyoshikawa.scenarioshop
---
- launchApp:
    clearState: true
- assertVisible: "Scenario Shop"
- extendedWaitUntil:
    visible: "Native test runtime listening"
    timeout: 30000
- openLink: "scenario-shop://test-control/reset?version=1&scenario=default&clock=2026-07-01T03%3A00%3A00.000Z&paymentDelayMs=0"
- extendedWaitUntil:
    visible: "Native test runtime ready"
    timeout: 30000
- tapOn:
    id: "native-nav-products"
- assertVisible:
    id: "native-nav-products"
- openLink: "scenario-shop://products/product-basic-shirt"
- extendedWaitUntil:
    visible:
      id: "native-product-detail-screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "native-variant-variant-basic-shirt-02"
    direction: DOWN
    speed: 10
    centerElement: true
    timeout: 30000
- tapOn:
    id: "native-variant-variant-basic-shirt-02"
- scrollUntilVisible:
    element:
      id: "native-add-to-cart"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "native-add-to-cart"
- extendedWaitUntil:
    visible: "カートに追加しました"
    timeout: 10000
- tapOn:
    id: "native-go-cart"
- assertVisible: "カート"
- tapOn: "＋"
- assertVisible: "2"
- tapOn: "−"
- assertVisible: "1"
- tapOn: "削除"
- assertVisible: "カート"
- assertVisible: "カートは空です"
- takeScreenshot: native-cart-empty
