appId: com.ryuyoshikawa.scenarioshop
---
- launchApp
- extendedWaitUntil:
    visible: "Native test runtime listening"
    timeout: 30000
- assertVisible: "Scenario Shop"
- openLink: "scenario-shop://test-control/reset?version=1&scenario=default&clock=2026-07-01T03%3A00%3A00.000Z&paymentDelayMs=0"
- runFlow: subflows/accept-ios-deep-link.yaml
- extendedWaitUntil:
    visible: "Native test runtime ready"
    timeout: 30000
- openLink: "scenario-shop://login"
- runFlow: subflows/accept-ios-deep-link.yaml
- extendedWaitUntil:
    visible:
      id: "native-login-screen"
    timeout: 30000
- tapOn:
    id: "native-login-submit"
- extendedWaitUntil:
    visible:
      id: "native-header-account"
    timeout: 30000
- openLink: "scenario-shop://cart"
- runFlow: subflows/accept-ios-deep-link.yaml
- extendedWaitUntil:
    visible:
      id: "native-persisted-state-ready"
    timeout: 30000
- tapOn:
    id: "native-cart-checkout"
- extendedWaitUntil:
    visible:
      id: "native-checkout-address-screen"
    timeout: 30000
- assertVisible:
    id: "native-checkout-session-started"
- extendedWaitUntil:
    visible:
      id: "native-checkout-address-session-ready"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "native-checkout-line2"
    direction: DOWN
    speed: 10
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
- tapOn:
    id: "native-checkout-line2"
- inputText: "青山ビル101"
- assertVisible:
    id: "native-checkout-line2"
    text: "青山ビル101"
- takeScreenshot: native-session-checkout-address-line2-keyboard
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "native-checkout-address-next"
    direction: DOWN
    speed: 10
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
- tapOn:
    id: "native-checkout-address-next"
- extendedWaitUntil:
    visible:
      id: "native-checkout-payment-screen"
    timeout: 30000
- takeScreenshot: native-session-checkout-before-stop
- stopApp
- launchApp
- assertVisible: "Scenario Shop"
- extendedWaitUntil:
    visible: "Native test runtime listening"
    timeout: 30000
- assertVisible:
    id: "native-header-account"
- openLink: "scenario-shop://checkout/address"
- runFlow: subflows/accept-ios-deep-link.yaml
- extendedWaitUntil:
    visible:
      id: "native-checkout-address-screen"
    timeout: 30000
- assertVisible:
    id: "native-checkout-session-resumed"
- extendedWaitUntil:
    visible:
      id: "native-checkout-address-session-ready"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "native-checkout-line2"
    direction: DOWN
    speed: 10
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
- assertVisible:
    id: "native-checkout-line2"
    text: "青山ビル101"
- takeScreenshot: native-session-checkout-address-line2-restored
- scrollUntilVisible:
    element:
      id: "native-checkout-address-next"
    direction: DOWN
    speed: 10
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
- tapOn:
    id: "native-checkout-address-next"
- extendedWaitUntil:
    visible:
      id: "native-checkout-payment-screen"
    timeout: 30000
- takeScreenshot: native-session-checkout-after-restart
