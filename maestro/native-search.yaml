appId: com.ryuyoshikawa.scenarioshop
---
- launchApp
- extendedWaitUntil:
    visible: "Native test runtime listening"
    timeout: 30000
- assertVisible: "Scenario Shop"
- openLink: "scenario-shop://test-control/reset?version=1&scenario=default&clock=2026-07-01T03%3A00%3A00.000Z&paymentDelayMs=0"
- runFlow: subflows/accept-ios-deep-link.yaml
- extendedWaitUntil:
    visible: "Native test runtime ready"
    timeout: 30000
- tapOn:
    id: "native-nav-search"
- assertVisible:
    id: "native-search-screen"
- openLink: "scenario-shop://search?q=0001"
- runFlow: subflows/accept-ios-deep-link.yaml
- extendedWaitUntil:
    visible:
      id: "native-suggestion-product-product-basic-shirt"
    timeout: 30000
- assertVisible:
    id: "native-suggestion-product-product-basic-shirt"
- tapOn:
    id: "native-search-submit"
- scrollUntilVisible:
    element:
      id: "native-product-card-product-basic-shirt"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "native-product-card-product-basic-shirt"
- tapOn:
    id: "native-filter-brand-brand-scenario-life"
- scrollUntilVisible:
    element:
      text: "該当する商品がありません"
    direction: DOWN
    timeout: 30000
- assertVisible: "該当する商品がありません"
- takeScreenshot: native-search-filtered-empty
