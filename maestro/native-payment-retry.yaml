appId: com.ryuyoshikawa.scenarioshop
---
- launchApp:
    clearState: true
- assertVisible: "Scenario Shop"
- extendedWaitUntil:
    visible: "Native test runtime listening"
    timeout: 30000
- openLink: "scenario-shop://test-control/reset?version=1&scenario=default&clock=2026-07-01T03%3A00%3A00.000Z&paymentDelayMs=3000"
- runFlow: subflows/accept-ios-deep-link.yaml
- extendedWaitUntil:
    visible: "Native test runtime ready"
    timeout: 30000
- openLink: "scenario-shop://login"
- runFlow: subflows/accept-ios-deep-link.yaml
- extendedWaitUntil:
    visible:
      id: "native-login-screen"
    timeout: 30000
- tapOn:
    id: "native-login-submit"
- extendedWaitUntil:
    visible:
      id: "native-header-account"
    timeout: 30000
- openLink: "scenario-shop://cart"
- runFlow: subflows/accept-ios-deep-link.yaml
- extendedWaitUntil:
    visible:
      id: "native-persisted-state-ready"
    timeout: 30000
- tapOn:
    id: "native-cart-checkout"
- extendedWaitUntil:
    visible:
      id: "native-checkout-address-screen"
    timeout: 30000
- tapOn:
    id: "native-checkout-address-next"
- extendedWaitUntil:
    visible:
      id: "native-checkout-payment-screen"
    timeout: 30000
- tapOn:
    id: "native-payment-method-TEST-DECLINED"
- tapOn:
    id: "native-checkout-payment-next"
- extendedWaitUntil:
    visible:
      id: "native-checkout-confirm-screen"
    timeout: 30000
- tapOn:
    id: "native-checkout-confirm-submit"
- extendedWaitUntil:
    visible:
      id: "native-checkout-processing-screen"
    timeout: 30000
- assertVisible:
    id: "native-payment-processing-message"
- extendedWaitUntil:
    visible:
      id: "native-checkout-failed-screen"
    timeout: 30000
- assertVisible: "支払いに失敗しました"
- tapOn:
    id: "native-payment-retry"
- extendedWaitUntil:
    visible:
      id: "native-checkout-complete-screen"
    timeout: 30000
- assertVisible: "注文完了"
- takeScreenshot: native-payment-retry-complete
