appId: com.ryuyoshikawa.scenarioshop
---
- launchApp:
    clearState: true
- assertVisible: "Scenario Shop"
- extendedWaitUntil:
    visible: "Native test runtime listening"
    timeout: 30000
- openLink: "scenario-shop://test-control/reset?version=1&scenario=default&clock=2026-07-01T03%3A00%3A00.000Z&paymentDelayMs=0"
- extendedWaitUntil:
    visible: "Native test runtime ready"
    timeout: 30000
- openLink: "scenario-shop://admin/test-control"
- assertVisible: "Native Contract Harness"
- assertVisible: "Native contract idle"
- tapOn: "Run native contract"
- extendedWaitUntil:
    visible: "Native contract passed"
    timeout: 30000
- takeScreenshot: native-contract-passed
