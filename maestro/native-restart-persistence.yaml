appId: com.ryuyoshikawa.scenarioshop
---
- launchApp:
    clearState: true
- assertVisible: "Scenario Shop"
- extendedWaitUntil:
    visible: "Native test runtime listening"
    timeout: 30000
- openLink: "scenario-shop://test-control/reset?version=1&scenario=default&clock=2026-07-01T03%3A00%3A00.000Z&paymentDelayMs=0"
- runFlow: subflows/accept-ios-deep-link.yaml
- extendedWaitUntil:
    visible: "Native test runtime ready"
    timeout: 30000
- openLink: "scenario-shop://products/product-basic-shirt"
- runFlow: subflows/accept-ios-deep-link.yaml
- extendedWaitUntil:
    visible:
      id: "native-product-detail-screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "native-variant-variant-basic-shirt-02"
    direction: DOWN
    speed: 10
    centerElement: true
    timeout: 30000
- tapOn:
    id: "native-variant-variant-basic-shirt-02"
- scrollUntilVisible:
    element:
      id: "native-add-to-cart"
    direction: DOWN
    timeout: 30000
- takeScreenshot: native-restart-persistence-before-add
- tapOn:
    id: "native-add-to-cart"
- scrollUntilVisible:
    element:
      id: "native-cart-add-message"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "native-cart-add-message"
- takeScreenshot: native-restart-persistence-after-add
- scrollUntilVisible:
    element:
      id: "native-go-cart"
    direction: UP
    timeout: 10000
- tapOn:
    id: "native-go-cart"
- extendedWaitUntil:
    visible:
      id: "native-cart-screen"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "native-persisted-state-ready"
    timeout: 30000
- assertVisible:
    id: "native-cart-badge-count"
    text: "1"
- assertVisible:
    id: "native-cart-item-product-basic-shirt-variant-basic-shirt-02"
- assertVisible: "ベーシックTシャツ"
- assertVisible:
    id: "native-cart-quantity-product-basic-shirt-variant-basic-shirt-02"
    text: "1"
- takeScreenshot: native-restart-persistence-before-stop
- stopApp
- launchApp
- assertVisible: "Scenario Shop"
- extendedWaitUntil:
    visible: "Native test runtime listening"
    timeout: 30000
- takeScreenshot: native-restart-persistence-after-launch
- tapOn:
    id: "native-nav-cart"
- extendedWaitUntil:
    visible:
      id: "native-persisted-state-ready"
    timeout: 30000
- takeScreenshot: native-restart-persistence-after-hydration
- assertVisible:
    id: "native-cart-screen"
- assertVisible:
    id: "native-cart-badge-count"
    text: "1"
- assertVisible:
    id: "native-cart-item-product-basic-shirt-variant-basic-shirt-02"
- assertVisible: "ベーシックTシャツ"
- assertVisible:
    id: "native-cart-quantity-product-basic-shirt-variant-basic-shirt-02"
    text: "1"
- takeScreenshot: native-restart-persistence-cart-screen
- takeScreenshot: native-restart-persistence-confirmed
