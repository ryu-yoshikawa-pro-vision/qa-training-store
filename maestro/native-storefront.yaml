appId: com.ryuyoshikawa.scenarioshop
---
- launchApp:
    clearState: true
- assertVisible: "Scenario Shop"
- extendedWaitUntil:
    visible: "Native test runtime listening"
    timeout: 30000
- openLink: "scenario-shop://test-control/reset?version=1&scenario=default&clock=2026-07-01T03%3A00%3A00.000Z&paymentDelayMs=0"
- extendedWaitUntil:
    visible: "Native test runtime ready"
    timeout: 30000
- assertVisible: "Scenario Shop"
- assertVisible:
    id: "native-nav-home"
- scrollUntilVisible:
    element:
      id: "native-category-category-apparel"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "native-category-category-apparel"
- assertVisible: "カテゴリの商品"
- tapOn:
    id: "native-nav-home"
- assertVisible:
    id: "native-nav-home"
- tapOn:
    id: "native-nav-products"
- assertVisible:
    id: "native-nav-products"
- tapOn:
    id: "native-catalog-search-input"
- inputText: "P-0001"
- hideKeyboard
- tapOn:
    id: "native-catalog-search-button"
- scrollUntilVisible:
    element:
      id: "native-product-card-product-basic-shirt"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "native-product-card-product-basic-shirt"
- scrollUntilVisible:
    element:
      id: "native-variant-variant-basic-shirt-02"
    direction: DOWN
    speed: 10
    centerElement: true
    timeout: 30000
- tapOn:
    id: "native-variant-variant-basic-shirt-02"
- scrollUntilVisible:
    element:
      id: "native-add-to-cart"
    direction: DOWN
    speed: 10
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
- tapOn:
    id: "native-add-to-cart"
- extendedWaitUntil:
    visible: "カートに追加しました"
    timeout: 10000
- takeScreenshot: native-storefront-cart-added
