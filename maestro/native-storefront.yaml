appId: com.ryuyoshikawa.scenarioshop
---
- launchApp:
    clearState: true
- assertVisible: "Scenario Shop"
- extendedWaitUntil:
    visible: "Native test runtime listening"
    timeout: 30000
- openLink: "scenario-shop://test-control/reset?version=1&scenario=default&clock=2026-07-01T03%3A00%3A00.000Z&paymentDelayMs=0"
- extendedWaitUntil:
    visible: "Native test runtime ready"
    timeout: 30000
- assertVisible: "Scenario Shop"
- assertVisible:
    id: "native-nav-home"
- scrollUntilVisible:
    element:
      id: "native-category-category-apparel"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "native-category-category-apparel"
- assertVisible: "カテゴリの商品"
- tapOn:
    id: "native-nav-home"
- assertVisible:
    id: "native-nav-home"
- tapOn:
    id: "native-nav-products"
- assertVisible:
    id: "native-nav-products"
- openLink: "scenario-shop://products/product-basic-shirt"
- extendedWaitUntil:
    visible:
      id: "native-product-detail-screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "native-variant-variant-basic-shirt-02"
    direction: DOWN
    speed: 10
    centerElement: true
    timeout: 30000
- tapOn:
    id: "native-variant-variant-basic-shirt-02"
- scrollUntilVisible:
    element:
      id: "native-add-to-cart"
    direction: DOWN
    speed: 10
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
- tapOn:
    id: "native-add-to-cart"
- scrollUntilVisible:
    element:
      id: "native-cart-add-message"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "native-cart-add-message"
- takeScreenshot: native-storefront-cart-added
