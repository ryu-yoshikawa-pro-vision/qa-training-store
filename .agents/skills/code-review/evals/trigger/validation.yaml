schema_version: 1
cases:
  - id: code-review-validation-001
    query: "このRepositoryのCodex直接起動とRun記録の現行手順を自己レビューし、仕様逸脱・失敗時の回帰リスク・不足する文書上の根拠を該当箇所とともに列挙してください。"
    expected_skill: code-review
    boundary: code-review-vs-repair-loop
  - id: code-review-validation-002
    query: "このRepositoryのpnpm run test:contractsがtests/contracts/codex-hook-contract.test.tsの失敗で止まった場合、最初の異常だけを分類し、変更範囲を越えない修正と同じテストの再実行を完了してください。"
    expected_skill: repair-loop
    boundary: code-review-vs-repair-loop
